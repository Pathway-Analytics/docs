<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">

  <!-- SEO Meta Tags -->
  <title>Pathway Analytics — Health Economics &amp; Strategy</title>
  <meta name="description" content="Pathway Analytics — specialist health economics and strategic advisory. Turning health evidence into funded policy.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://docs.pathwayanalytics.com">

  <!-- Open Graph -->
  <meta property="og:title" content="Pathway Analytics — Health Economics &amp; Strategy">
  <meta property="og:description" content="Pathway Analytics — specialist health economics and strategic advisory. Turning health evidence into funded policy.">
  <meta property="og:image" content="https://mta-sts.pathwayanalytics.com/logo/Pathway%20Analytics%20Logo%20small.png">
  <meta property="og:url" content="https://docs.pathwayanalytics.com">
  <meta property="og:type" content="website">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",

    "name": "Pathway Analytics",
    "url": "https://docs.pathwayanalytics.com",

      "@type": "ContactPoint",

    }
  }
  </script>

  <!-- Favicon and Icons -->
  <link rel="icon" type="image/x-icon" href="https://mta-sts.pathwayanalytics.com/icons/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="https://mta-sts.pathwayanalytics.com/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://mta-sts.pathwayanalytics.com/icons/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="https://mta-sts.pathwayanalytics.com/icons/android-chrome-512x512.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/custom.css">

  <!-- Inline theme setup -->
  <script>
    (function() {
      document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>

<body>
  <!-- Skip Navigation Link -->
  <a href="#app" class="skip-link">Skip to main content</a>

  <div id="app" role="main" aria-label="Documentation content">Loading&hellip;</div>

  <noscript>
    <p>This documentation site requires JavaScript to function. Please enable JavaScript in your browser settings to view the content.</p>
  </noscript>

  <!-- Docsify Configuration -->
  <script>
    window.$docsify = {
      name: 'Pathway Analytics',
      nameLink: '/',
      loadSidebar: '_sidebar.md',
      loadNavbar: '_navbar.md',
      mergeNavbar: false,
      routerMode: 'hash',
      subMaxLevel: 2,
      auto2top: true,
      maxLevel: 4,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: 'Type to search',
        noData: 'No matches found.',
        depth: 4,
        pathNamespaces: ['/sexual-health-tariff', '/case-studies', '/health-pathways', '/ftci', '/style-guide', '/healthcare-economics-toolkit']
      },
      formatUpdated: '{DD}/{MM}/{YYYY}',
      notFoundPage: true,
      noEmoji: true
    };
  </script>

  <!-- Custom Plugins -->
  <script>
    // Mobile Sidebar Plugin
    // The sidebar (and the search box it contains) is now PERSISTENT across
    // every section — a single global _sidebar.md keeps navigation context and
    // search available everywhere, instead of only inside /sexual-health-tariff.
    // This plugin only wires up the mobile toggle and the page-title update.
    function sidebarTogglePlugin(hook, vm) {
      // Keep the body class stable so the layout CSS always reserves the
      // sidebar column; collapse to an overlay only at the mobile breakpoint.
      document.body.classList.add('has-sidebar');

      hook.mounted(function () {
        var toggle = document.querySelector('.sidebar-toggle');
        if (toggle) {
          toggle.addEventListener('click', function () {
            document.body.classList.toggle('sidebar-open');
          });
        }
      });

      // Close the mobile sidebar overlay after navigating to a new page.
      hook.doneEach(function () {
        document.body.classList.remove('sidebar-open');
      });

      // Fix page title on route change
      hook.doneEach(function () {
        var path = vm.route.path || '/';
        if (path === '/' || path === '') {
          document.title = 'Pathway Analytics';
        } else {
          var h1 = document.querySelector('.markdown-section h1');
          if (h1) {
            document.title = h1.textContent.trim() + ' — Pathway Analytics';
          }
        }
      });
    }

    // Dark Mode Plugin
    // Manages dark mode toggle, localStorage persistence, and OS preference detection
    function darkModePlugin(hook, vm) {
      var STORAGE_KEY = 'pa-theme-preference';
      var LOGO_LIGHT = 'https://mta-sts.pathwayanalytics.com/logo/Pathway%20Analytics%20Logo%20small.png';
      var LOGO_DARK = 'https://mta-sts.pathwayanalytics.com/logo/Pathway%20Analytics%20Logo%20small%20white.png';

      function getStoredPreference() {
        try {
          return localStorage.getItem(STORAGE_KEY);
        } catch (e) {
          return null;
        }
      }

      function setStoredPreference(theme) {
        try {
          localStorage.setItem(STORAGE_KEY, theme);
        } catch (e) {
          // localStorage unavailable, silently ignore
        }
      }

      function getPreferredTheme() {
        var stored = getStoredPreference();
        if (stored === 'dark' || stored === 'light') return stored;
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
        return 'light';
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        // Update toggle button
        var toggleBtn = document.getElementById('dark-mode-toggle');
        if (toggleBtn) {
          toggleBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
          toggleBtn.innerHTML = theme === 'dark'
            ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
            : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        }
      }

      hook.mounted(function () {
        // Create dark mode toggle as a fixed-position element (independent of nav)
        var toggleBtn = document.createElement('button');
        toggleBtn.id = 'dark-mode-toggle';
        toggleBtn.className = 'dark-mode-toggle';
        toggleBtn.type = 'button';

        var currentTheme = getPreferredTheme();
        toggleBtn.innerHTML = currentTheme === 'dark'
          ? '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
          : '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
        toggleBtn.setAttribute('aria-label', currentTheme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');

        toggleBtn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme') || 'light';
          var newTheme = current === 'dark' ? 'light' : 'dark';
          applyTheme(newTheme);
          setStoredPreference(newTheme);
        });

        // Append directly to body — CSS will position it fixed in top-right
        document.body.appendChild(toggleBtn);

        // Apply initial theme
        applyTheme(currentTheme);
      });
    }

    // Edit Link Plugin
    // Appends a "Suggest an edit" link pointing to the GitHub source file
    function editLinkPlugin(hook, vm) {
      hook.afterEach(function (html) {
        var filepath = vm.route.file;
        if (!filepath) return html;
        var editUrl = 'https://github.com/Pathway-Analytics/docs/edit/main/' + filepath;
        var editHtml = '<div class="edit-link">' +
          '<a href="' + editUrl + '" target="_blank" rel="noopener">' +
          '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
          '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>' +
          '</svg> Suggest an edit</a></div>';
        return html + editHtml;
      });
    }

    // Collapsible Sidebar Plugin
    // Makes sidebar items with sub-lists collapsible
    // Groups are collapsed by default unless the active page is within them
    // Ignores Docsify's auto-generated .app-sub-sidebar (page headings)
    function collapsibleSidebarPlugin(hook, vm) {
      hook.doneEach(function () {
        var sidebarNav = document.querySelector('.sidebar-nav');
        if (!sidebarNav) return;

        // Remove previous initialization so it re-evaluates on navigation
        sidebarNav.querySelectorAll('.collapsible-initialized').forEach(function (li) {
          li.classList.remove('collapsible-initialized');
        });

        // Find all list items that have a child <ul> (i.e. they have sub-items)
        var items = sidebarNav.querySelectorAll('li');
        items.forEach(function (li) {
          var subList = li.querySelector(':scope > ul');
          if (!subList) return;

          // Skip Docsify's auto-generated page-heading lists
          if (subList.classList.contains('app-sub-sidebar')) return;

          if (li.classList.contains('collapsible-initialized')) return;

          var link = li.querySelector(':scope > a') || li.querySelector(':scope > p > a');
          if (!link) return;

          li.classList.add('collapsible-initialized');
          li.classList.add('collapsible');

          // Check if current page is within this group
          var allLinks = subList.querySelectorAll('a');
          var currentPath = vm.route.path;
          var isActiveGroup = false;
          allLinks.forEach(function (a) {
            var href = (a.getAttribute('href') || '').replace('#', '');
            if (href && currentPath === href) {
              isActiveGroup = true;
            }
          });
          // Also check if the parent link itself is active
          var parentHref = (link.getAttribute('href') || '').replace('#', '');
          if (parentHref && currentPath === parentHref) {
            isActiveGroup = true;
          }

          // Collapse by default unless the active page is in this group
          if (!isActiveGroup) {
            li.classList.add('collapsed');
          } else {
            li.classList.remove('collapsed');
          }

          // Add a toggle arrow that expands/collapses without navigating
          if (!li.querySelector('.collapse-toggle')) {
            var toggle = document.createElement('span');
            toggle.className = 'collapse-toggle';
            toggle.setAttribute('aria-label', 'Toggle section');
            li.insertBefore(toggle, subList);

            toggle.addEventListener('click', function (e) {
              e.preventDefault();
              e.stopPropagation();
              li.classList.toggle('collapsed');
            });
          }
        });
      });
    }

    // Callout Styling Plugin
    // Adds CSS classes to blockquotes based on their label text
    function calloutPlugin(hook) {
      hook.doneEach(function () {
        var blockquotes = document.querySelectorAll('.markdown-section blockquote');
        blockquotes.forEach(function (bq) {
          var text = bq.textContent || '';
          if (text.match(/^\s*Important:/)) {
            bq.classList.add('callout-important');
          } else if (text.match(/^\s*Note:/)) {
            bq.classList.add('callout-note');
          }
        });
      });
    }

    // Search Highlight Plugin
    // Highlights matching text in the document after navigating from search results
    function searchHighlightPlugin(hook, vm) {
      hook.doneEach(function () {
        // Remove previous highlights
        document.querySelectorAll('.search-highlight').forEach(function (el) {
          var parent = el.parentNode;
          parent.replaceChild(document.createTextNode(el.textContent), el);
          parent.normalize();
        });

        // Get search query from the search input
        var searchInput = document.querySelector('.search input');
        if (!searchInput) return;
        var query = searchInput.value.trim();
        if (!query || query.length < 2) return;

        // Highlight matches in the content area
        var content = document.querySelector('.markdown-section');
        if (!content) return;

        var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null, false);
        var nodesToHighlight = [];
        var regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');

        while (walker.nextNode()) {
          var node = walker.currentNode;
          if (node.parentElement.closest('script, style, .search-highlight')) continue;
          if (regex.test(node.textContent)) {
            nodesToHighlight.push(node);
          }
          regex.lastIndex = 0;
        }

        nodesToHighlight.forEach(function (textNode) {
          var span = document.createElement('span');
          span.innerHTML = textNode.textContent.replace(regex, '<mark class="search-highlight">$1</mark>');
          textNode.parentNode.replaceChild(span, textNode);
        });
      });
    }

    // Anchor Scroll Plugin
    // Scrolls to element IDs specified in ?id= query parameter for custom div sections
    function anchorScrollPlugin(hook, vm) {
      hook.doneEach(function () {
        var path = vm.route.path || '/';
        var query = vm.route.query || {};
        var targetId = query.id;
        if (targetId && (path === '/' || path === '')) {
          setTimeout(function () {
            var el = document.getElementById(targetId);
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          }, 100);
        }
      });
    }

    // CMS Segment Plugin
    // Resolves {{segment:short-name}} / {{segment:short-name:style}} tokens by
    // fetching the Pathway Analytics public CMS API, so shared content (e.g. the
    // copyright notice) has a single source of truth in the pwa-refactor CMS.
    // A static fallback renders if the API is unreachable.
    function cmsSegmentPlugin(hook) {
      var CMS_BASE = 'https://api.pathwayanalytics.com/cms/public/';
      var cache = {};

      // Static fallback, used only if the CMS fetch fails. Kept in step with the
      // copyright segment's published body so the notice is never empty.
      var FALLBACK = {
        copyright:
          'Copyright &copy; 2026 Debigno Ltd trading as Pathway Analytics. ' +
          'All rights reserved. This work is licensed under the Creative Commons ' +
          'Attribution-NonCommercial-ShareAlike 4.0 International License ' +
          '(CC BY-NC-SA 4.0). Full licence text: ' +
          '<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">creativecommons.org/licenses/by-nc-sa/4.0</a>.'
      };

      function fetchSegment(shortName) {
        if (cache[shortName]) return cache[shortName];
        cache[shortName] = fetch(CMS_BASE + encodeURIComponent(shortName), {
          headers: { Accept: 'application/json' }
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (json) {
            var seg = json && json.data && json.data.segment;
            return (seg && seg.bodyHtml) ? seg.bodyHtml : (FALLBACK[shortName] || '');
          })
          .catch(function () { return FALLBACK[shortName] || ''; });
        return cache[shortName];
      }

      // Replace tokens with placeholder spans during markdown parse; fill them
      // asynchronously after render so a slow API never blocks the page.
      hook.beforeEach(function (content) {
        return content.replace(/\{\{segment:([a-z0-9-]+)(?::([a-z0-9-]+))?\}\}/gi, function (_m, name, style) {
          return '<div class="cms-segment" data-segment="' + name + '" data-style="' + (style || '') + '">' +
                 '<span class="cms-segment-loading">&hellip;</span></div>';
        });
      });

      hook.doneEach(function () {
        var nodes = document.querySelectorAll('.cms-segment[data-segment]');
        nodes.forEach(function (el) {
          if (el.getAttribute('data-filled') === '1') return;
          el.setAttribute('data-filled', '1');
          fetchSegment(el.getAttribute('data-segment')).then(function (html) {
            el.innerHTML = html || '';
          });
        });
      });
    }

    // Register all custom plugins
    window.$docsify.plugins = (window.$docsify.plugins || []).concat([
      sidebarTogglePlugin,
      collapsibleSidebarPlugin,
      calloutPlugin,
      searchHighlightPlugin,
      anchorScrollPlugin,
      editLinkPlugin,
      cmsSegmentPlugin
    ]);
  </script>

  <!-- Docsify Core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Docsify Plugins (async to avoid blocking render) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js" async></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2" async></script>
</body>

</html>
