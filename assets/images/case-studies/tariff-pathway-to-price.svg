<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5f6b7a"/></marker></defs>
  <text x="0" y="16" font-size="12" font-weight="600" fill="#5f6b7a" letter-spacing="1">ONE PATHWAY</text>
  <!-- contacts -->
  <rect x="0" y="28" width="250" height="70" rx="8" fill="#f4f6f8"/>
  <text x="12" y="46" font-size="11.5" fill="#14335a" font-weight="600">First contact</text>
  <rect x="270" y="28" width="450" height="70" rx="8" fill="#f4f6f8"/>
  <text x="282" y="46" font-size="11.5" fill="#14335a" font-weight="600">Follow-up contacts</text>
  <g font-size="11" fill="#fff" text-anchor="middle">
    <rect x="12" y="56" width="66" height="30" rx="4" fill="#14335a"/><text x="45" y="75">Step</text>
    <rect x="92" y="56" width="66" height="30" rx="4" fill="#14335a"/><text x="125" y="75">Step</text>
    <rect x="172" y="56" width="66" height="30" rx="4" fill="#c9a24a"/><text x="205" y="75">Step</text>
    <rect x="282" y="56" width="66" height="30" rx="4" fill="#14335a"/><text x="315" y="75">Step</text>
    <rect x="362" y="56" width="66" height="30" rx="4" fill="#14335a"/><text x="395" y="75">Step</text>
    <rect x="442" y="56" width="66" height="30" rx="4" fill="#14335a"/><text x="475" y="75">Step</text>
  </g>
  <text x="530" y="76" font-size="11.5" fill="#5f6b7a">… as the pathway requires</text>
  <!-- zoom -->
  <path d="M172,86 L60,128 M238,86 L330,128" stroke="#c9a24a" stroke-width="1" fill="none"/>
  <rect x="0" y="128" width="400" height="128" rx="8" fill="#fff" stroke="#c9a24a" stroke-width="1.5"/>
  <text x="14" y="150" font-size="12" font-weight="600" fill="#14335a">Cost of one step</text>
  <text x="14" y="176" font-size="12.5" fill="#1f2933">Staff time  ×  cost per minute of clinical time</text>
  <text x="14" y="200" font-size="12.5" fill="#1f2933">+  drugs, tests, consumables and pathology</text>
  <line x1="14" y1="214" x2="386" y2="214" stroke="#e3e6ea"/>
  <text x="14" y="240" font-size="12.5" fill="#14335a" font-weight="600">=  direct cost of the step</text>
  <!-- plus indirect -->
  <line x1="408" y1="192" x2="438" y2="192" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="444" y="128" width="130" height="128" rx="8" fill="#f4f6f8"/>
  <text x="456" y="150" font-size="12" font-weight="600" fill="#518386">+ indirect costs</text>
  <text x="456" y="174" font-size="11" fill="#1f2933">Staff not facing</text>
  <text x="456" y="188" font-size="11" fill="#1f2933">patients</text>
  <text x="456" y="208" font-size="11" fill="#1f2933">Provider overheads</text>
  <text x="456" y="228" font-size="11" fill="#1f2933">Facilities and</text>
  <text x="456" y="242" font-size="11" fill="#1f2933">management</text>
  <line x1="580" y1="192" x2="604" y2="192" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="610" y="150" width="110" height="84" rx="8" fill="#14335a"/>
  <text x="665" y="184" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Cost per</text>
  <text x="665" y="202" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">pathway</text>
</svg>
