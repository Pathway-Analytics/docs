  <text x="360" y="113" font-size="15" font-weight="600" fill="#14335a" text-anchor="middle">Designing an economically robust alternative</text>
  <text x="360" y="133" font-size="12.5" fill="#5f6b7a" text-anchor="middle">Clinical pathways, resource costing and payment methodology</text>
  <line x1="360" y1="152" x2="360" y2="166" stroke="#9aa3ad" stroke-width="1.5"/>
