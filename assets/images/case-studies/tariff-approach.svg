  <text x="360" y="219" font-size="12.5" fill="#5f6b7a" text-anchor="middle">Clinical engagement, financial scrutiny and impact modelling</text>
  <line x1="360" y1="238" x2="360" y2="252" stroke="#9aa3ad" stroke-width="1.5"/>
