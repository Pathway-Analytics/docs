<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 574" width="360" height="574" role="img" aria-label="One pathway is a first contact and follow-up contacts, each made of steps. The direct cost of each step is staff time times cost per clinical minute, plus drugs, tests, consumables and pathology, added up across every step. Adding an allowance for indirect costs gives the cost per pathway." font-family="Arial, Helvetica, sans-serif">
<title>One pathway is a first contact and follow-up contacts, each made of steps. The direct cost of each step is staff time times cost per clinical minute, plus drugs, tests, consumables and pathology, added up across every step. Adding an allowance for indirect costs gives the cost per pathway.</title>
<rect width="360" height="574" fill="#ffffff"/>
<text x="12" y="14" font-size="13" font-weight="bold" fill="#5f6b7a">One pathway</text>
<text x="74" y="44" font-size="13.5" text-anchor="middle" fill="#14335a">First contact</text>
<text x="246" y="44" font-size="13.5" text-anchor="middle" fill="#14335a">Follow-up contacts</text>
<line x1="12" y1="70" x2="318" y2="70" stroke="#14335a" stroke-width="1.75"/>
<line x1="322" y1="70" x2="348" y2="70" stroke="#14335a" stroke-width="1.25" stroke-dasharray="4 4"/>
<line x1="160" y1="61" x2="160" y2="79" stroke="#5f6b7a" stroke-width="1"/>
<circle cx="24" cy="70" r="4.5" fill="#14335a"/><text x="24" y="96" font-size="13" text-anchor="middle" fill="#14335a">Step</text>
<circle cx="74" cy="70" r="4.5" fill="#14335a"/><text x="74" y="96" font-size="13" text-anchor="middle" fill="#14335a">Step</text>
<circle cx="124" cy="70" r="6.5" fill="#c9a24a"/><text x="124" y="96" font-size="13" text-anchor="middle" font-weight="bold" fill="#7a5c1a">Step</text>
<circle cx="196" cy="70" r="4.5" fill="#14335a"/><text x="196" y="96" font-size="13" text-anchor="middle" fill="#14335a">Step</text>
<circle cx="246" cy="70" r="4.5" fill="#14335a"/><text x="246" y="96" font-size="13" text-anchor="middle" fill="#14335a">Step</text>
<circle cx="296" cy="70" r="4.5" fill="#14335a"/><text x="296" y="96" font-size="13" text-anchor="middle" fill="#14335a">Step</text>
<text x="348" y="116" font-size="13" text-anchor="end" font-style="italic" fill="#5f6b7a">… as the pathway requires</text>
<path d="M114 106 L12 180 M134 106 L348 180" fill="none" stroke="#c9a24a" stroke-width="1.25" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="12" y1="180" x2="348" y2="180" stroke="#c9a24a" stroke-width="1.75"/>
<text x="12" y="207" font-size="17" font-weight="bold" fill="#14335a">Direct cost</text>
<text x="12" y="231" font-size="13" fill="#14335a">For each step: staff time × cost per clinical minute</text>
<text x="12" y="250" font-size="13" fill="#14335a">+ drugs, tests, consumables and pathology</text>
<text x="12" y="269" font-size="13" fill="#14335a">added up across every step of the pathway</text>
<line x1="12" y1="287" x2="348" y2="287" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="309" font-size="13" font-weight="bold" fill="#14335a">= direct cost of the pathway</text>
<text x="180" y="346" font-size="26" text-anchor="middle" fill="#5f6b7a">+</text>
<line x1="12" y1="362" x2="348" y2="362" stroke="#518386" stroke-width="1.75"/>
<text x="12" y="389" font-size="17" font-weight="bold" fill="#3f6b6e">Indirect costs</text>
<text x="12" y="411" font-size="13" font-style="italic" fill="#5f6b7a">an allowance for:</text>
<text x="12" y="433" font-size="13" fill="#14335a">Staff not facing patients</text>
<text x="12" y="452" font-size="13" fill="#14335a">Provider overheads</text>
<text x="12" y="471" font-size="13" fill="#14335a">Facilities and management</text>
<text x="180" y="510" font-size="26" text-anchor="middle" fill="#5f6b7a">=</text>
<line x1="100" y1="528" x2="260" y2="528" stroke="#14335a" stroke-width="2.5"/>
<text x="180" y="558" font-size="20" text-anchor="middle" font-weight="bold" fill="#14335a">Cost per pathway</text>
</svg>
