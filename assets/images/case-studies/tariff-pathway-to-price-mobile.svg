<text x="12.0" y="251.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="start" style="fill:var(--g-ink,#1f2933)">+ drugs, tests, consumables and pathology</text>
