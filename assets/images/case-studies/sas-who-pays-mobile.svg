<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" role="img" aria-label="Each step of the pathway, from initial contact to court support, is costed and multiplied by the number of victims who use it. The steps add up to the total cost of the pathways, which is split step by step between NHS England, clinical commissioning groups, local authorities, the police, Police and Crime Commissioners and the Ministry of Justice. A proposed allocation, not an agreed settlement." font-family="Arial, Helvetica, sans-serif">
<title>Each step of the pathway, from initial contact to court support, is costed and multiplied by the number of victims who use it. The steps add up to the total cost of the pathways, which is split step by step between NHS England, clinical commissioning groups, local authorities, the police, Police and Crime Commissioners and the Ministry of Justice. A proposed allocation, not an agreed settlement.</title>
<rect width="360" height="500" fill="#ffffff"/>
<line x1="22" y1="44" x2="22" y2="240" stroke="#14335a" stroke-width="1.75"/>
<text x="12" y="16" font-size="12" font-weight="bold" fill="#5f6b7a">Victims who reach the services</text>
<circle cx="22" cy="44" r="4.5" fill="#14335a"/>
<text x="40" y="48.5" font-size="12.5" fill="#14335a">Initial contact</text>
<text x="348" y="48.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<circle cx="22" cy="72" r="4.5" fill="#14335a"/>
<text x="40" y="76.5" font-size="12.5" fill="#14335a">Risk assessment</text>
<text x="348" y="76.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<circle cx="22" cy="100" r="4.5" fill="#14335a"/>
<text x="40" y="104.5" font-size="12.5" fill="#14335a">Forensic examination</text>
<text x="348" y="104.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<circle cx="22" cy="128" r="4.5" fill="#14335a"/>
<text x="40" y="132.5" font-size="12.5" fill="#14335a">Verbal evidence</text>
<text x="348" y="132.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<circle cx="22" cy="156" r="4.5" fill="#14335a"/>
<text x="40" y="160.5" font-size="12.5" fill="#14335a">Needs assessment</text>
<text x="348" y="160.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<circle cx="22" cy="184" r="4.5" fill="#14335a"/>
<text x="40" y="188.5" font-size="12.5" fill="#14335a">Follow-up support</text>
<text x="348" y="188.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<circle cx="22" cy="212" r="4.5" fill="#14335a"/>
<text x="40" y="216.5" font-size="12.5" fill="#14335a">Counselling</text>
<text x="348" y="216.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<circle cx="22" cy="240" r="4.5" fill="#14335a"/>
<text x="40" y="244.5" font-size="12.5" fill="#14335a">Court support</text>
<text x="348" y="244.5" font-size="11.5" text-anchor="end" fill="#5f6b7a">£ × victims</text>
<line x1="22" y1="240" x2="22" y2="274" stroke="#518386" stroke-width="1.25"/>
<circle cx="22" cy="280" r="6.5" fill="#c9a24a"/>
<text x="40" y="285" font-size="15" font-weight="bold" fill="#14335a">Total cost of the pathways</text>
<line x1="22" y1="288" x2="22" y2="314" stroke="#14335a" stroke-width="1.25"/>
<text x="40" y="312" font-size="11.5" font-weight="bold" fill="#5f6b7a">Split step by step between six public bodies</text>
<circle cx="22" cy="338" r="4.5" fill="#14335a"/>
<text x="40" y="342.5" font-size="12.5" fill="#14335a">NHS England</text>
<line x1="22" y1="344" x2="22" y2="360" stroke="#14335a" stroke-width="1.25"/>
<circle cx="22" cy="366" r="4.5" fill="#14335a"/>
<text x="40" y="370.5" font-size="12.5" fill="#14335a">Clinical commissioning groups</text>
<line x1="22" y1="372" x2="22" y2="388" stroke="#14335a" stroke-width="1.25"/>
<circle cx="22" cy="394" r="4.5" fill="#14335a"/>
<text x="40" y="398.5" font-size="12.5" fill="#14335a">Local authorities</text>
<line x1="22" y1="400" x2="22" y2="416" stroke="#14335a" stroke-width="1.25"/>
<circle cx="22" cy="422" r="4.5" fill="#14335a"/>
<text x="40" y="426.5" font-size="12.5" fill="#14335a">Police</text>
<line x1="22" y1="428" x2="22" y2="444" stroke="#14335a" stroke-width="1.25"/>
<circle cx="22" cy="450" r="4.5" fill="#14335a"/>
<text x="40" y="454.5" font-size="12.5" fill="#14335a">Police and Crime Commissioners</text>
<line x1="22" y1="456" x2="22" y2="472" stroke="#14335a" stroke-width="1.25"/>
<circle cx="22" cy="478" r="4.5" fill="#14335a"/>
<text x="40" y="482.5" font-size="12.5" fill="#14335a">Ministry of Justice</text>
</svg>
