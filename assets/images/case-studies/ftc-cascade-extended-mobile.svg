<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 488" width="360" height="488" role="img" aria-label="The HIV care cascade extended. The UNAIDS clinical cascade, London in 2016: 90% of people living with HIV diagnosed, 97% of those diagnosed on treatment, and 97% of those on treatment virally suppressed. Pathway Analytics added prevention before diagnosis and living well after viral suppression, with stigma and discrimination addressed across the whole pathway." font-family="Arial, Helvetica, sans-serif">
<title>The HIV care cascade extended. The UNAIDS clinical cascade, London in 2016: 90% of people living with HIV diagnosed, 97% of those diagnosed on treatment, and 97% of those on treatment virally suppressed. Pathway Analytics added prevention before diagnosis and living well after viral suppression, with stigma and discrimination addressed across the whole pathway.</title>
<rect width="360" height="488" fill="#ffffff"/>
<line x1="18" y1="46" x2="18" y2="364" stroke="#14335a" stroke-width="1.75"/>
<circle cx="18" cy="46" r="5" fill="#518386"/>
<circle cx="18" cy="132" r="5" fill="#14335a"/>
<circle cx="18" cy="196" r="5" fill="#14335a"/>
<circle cx="18" cy="260" r="5" fill="#14335a"/>
<circle cx="18" cy="364" r="5" fill="#518386"/>
<text x="36" y="20" font-size="12" font-weight="bold" fill="#3f6b6e">Added</text>
<text x="36" y="51" font-size="15" font-weight="bold" fill="#3f6b6e">Prevention</text>
<text x="36" y="70" font-size="12" fill="#5f6b7a">Reducing new infections</text>
<text x="36" y="106" font-size="12" font-weight="bold" fill="#5f6b7a">UNAIDS clinical cascade, London 2016</text>
<text x="36" y="137" font-size="15" font-weight="bold" fill="#14335a">Diagnosed</text>
<text x="36" y="166" font-size="24" font-weight="bold" fill="#14335a">90%</text>
<text x="100" y="159" font-size="12" fill="#14335a">of people living</text>
<text x="100" y="174" font-size="12" fill="#14335a">with HIV</text>
<text x="36" y="201" font-size="15" font-weight="bold" fill="#14335a">On treatment</text>
<text x="36" y="230" font-size="24" font-weight="bold" fill="#14335a">97%</text>
<text x="100" y="223" font-size="12" fill="#14335a">of those</text>
<text x="100" y="238" font-size="12" fill="#14335a">diagnosed</text>
<text x="36" y="265" font-size="15" font-weight="bold" fill="#14335a">Virally suppressed</text>
<text x="36" y="294" font-size="24" font-weight="bold" fill="#14335a">97%</text>
<text x="100" y="287" font-size="12" fill="#14335a">of those on</text>
<text x="100" y="302" font-size="12" fill="#14335a">treatment</text>
<text x="36" y="338" font-size="12" font-weight="bold" fill="#3f6b6e">Added</text>
<text x="36" y="369" font-size="15" font-weight="bold" fill="#3f6b6e">Living well</text>
<text x="36" y="388" font-size="12" fill="#5f6b7a">Health, wellbeing and quality of life</text>
<line x1="12" y1="412" x2="348" y2="412" stroke="#518386" stroke-width="3"/>
<text x="12" y="438" font-size="15" font-weight="bold" fill="#3f6b6e">Stigma and discrimination</text>
<text x="12" y="457" font-size="12.5" fill="#3f6b6e">Added, and addressed across</text>
<text x="12" y="474" font-size="12.5" fill="#3f6b6e">the whole pathway</text>
</svg>
