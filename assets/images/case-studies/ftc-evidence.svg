<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-label="How the review gathered evidence. At the stakeholder event on 13 July 2018, participants recorded their own views, discussed them in groups, then identified examples and sources of further evidence, raising 317 assets and 298 gaps for further exploration, not validated findings. The wider research included interviews with more than 80 stakeholders, surveys, literature reviews and two Unheard Voices workshops with 24 people living with HIV. More than 120 stakeholders took part overall; the counts overlap." font-family="Arial, Helvetica, sans-serif">
<title>How the review gathered evidence. At the stakeholder event on 13 July 2018, participants recorded their own views, discussed them in groups, then identified examples and sources of further evidence, raising 317 assets and 298 gaps for further exploration, not validated findings. The wider research included interviews with more than 80 stakeholders, surveys, literature reviews and two Unheard Voices workshops with 24 people living with HIV. More than 120 stakeholders took part overall; the counts overlap.</title>
<rect width="720" height="336" fill="#ffffff"/>
<text x="10" y="16" font-size="12" font-weight="bold" fill="#5f6b7a">Stakeholder event, 13 July 2018</text>
<line x1="10" y1="56" x2="356" y2="56" stroke="#14335a" stroke-width="1.75"/>
<line x1="356" y1="56" x2="526" y2="56" stroke="#5f6b7a" stroke-width="1.25" stroke-dasharray="4 4"/>
<circle cx="16" cy="56" r="4.5" fill="#14335a"/>
<text x="10" y="88" font-size="14" font-weight="bold" fill="#14335a">Individual reflection</text>
<text x="10" y="108" font-size="11.5" fill="#5f6b7a">Own views recorded first</text>
<circle cx="186" cy="56" r="4.5" fill="#14335a"/>
<text x="180" y="88" font-size="14" font-weight="bold" fill="#14335a">Table discussion</text>
<text x="180" y="108" font-size="11.5" fill="#5f6b7a">Views explored in groups</text>
<circle cx="356" cy="56" r="4.5" fill="#14335a"/>
<text x="350" y="88" font-size="14" font-weight="bold" fill="#14335a">Evidence and contacts</text>
<text x="350" y="108" font-size="11.5" fill="#5f6b7a">Examples and sources</text>
<text x="350" y="124" font-size="11.5" fill="#5f6b7a">of further evidence</text>
<text x="540" y="52" font-size="20" font-weight="bold" fill="#14335a">317 assets</text>
<text x="540" y="78" font-size="20" font-weight="bold" fill="#14335a">298 gaps</text>
<text x="540" y="100" font-size="11.5" fill="#5f6b7a">Raised for further exploration,</text>
<text x="540" y="116" font-size="11.5" fill="#5f6b7a">not validated findings</text>
<line x1="10" y1="150" x2="710" y2="150" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="178" font-size="12" font-weight="bold" fill="#5f6b7a">Wider research</text>
<line x1="10" y1="192" x2="170" y2="192" stroke="#14335a" stroke-width="1.75"/>
<text x="10" y="216" font-size="14" font-weight="bold" fill="#14335a">Interviews</text>
<text x="10" y="236" font-size="11.5" fill="#5f6b7a">More than 80 stakeholders</text>
<line x1="186" y1="192" x2="346" y2="192" stroke="#14335a" stroke-width="1.75"/>
<text x="186" y="216" font-size="14" font-weight="bold" fill="#14335a">Surveys</text>
<line x1="362" y1="192" x2="522" y2="192" stroke="#14335a" stroke-width="1.75"/>
<text x="362" y="216" font-size="14" font-weight="bold" fill="#14335a">Literature reviews</text>
<line x1="538" y1="192" x2="698" y2="192" stroke="#14335a" stroke-width="1.75"/>
<text x="538" y="216" font-size="14" font-weight="bold" fill="#14335a">Unheard Voices</text>
<text x="538" y="236" font-size="11.5" fill="#5f6b7a">Two workshops with 24</text>
<text x="538" y="252" font-size="11.5" fill="#5f6b7a">people living with HIV</text>
<line x1="10" y1="276" x2="710" y2="276" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="302" font-size="14" font-weight="bold" fill="#14335a">More than 120 stakeholders took part overall</text>
<text x="10" y="322" font-size="12" fill="#5f6b7a">The counts overlap, so they are not added together</text>
</svg>
