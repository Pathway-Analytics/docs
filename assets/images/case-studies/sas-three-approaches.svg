<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 294" width="720" height="294" role="img" aria-label="Three ways of sharing the same cost: current funding, based on 2014/15 survey returns, shows historical contracts, grants and budgets; policy-based allocation, based on statutory responsibilities and national policy, shows responsibilities as written; pathway-based allocation, based on each step of the 29 core pathways, shows funding that follows the victim's need. The three gave very different splits between the funding bodies." font-family="Arial, Helvetica, sans-serif">
<title>Three ways of sharing the same cost: current funding, based on 2014/15 survey returns, shows historical contracts, grants and budgets; policy-based allocation, based on statutory responsibilities and national policy, shows responsibilities as written; pathway-based allocation, based on each step of the 29 core pathways, shows funding that follows the victim's need. The three gave very different splits between the funding bodies.</title>
<rect width="720" height="294" fill="#ffffff"/>
<line x1="10" y1="14" x2="230" y2="14" stroke="#14335a" stroke-width="1.75"/>
<text x="10" y="42" font-size="16" font-weight="bold" fill="#14335a">Current funding</text>
<text x="10" y="62" font-size="12.5" font-style="italic" fill="#5f6b7a">Who pays now?</text>
<text x="10" y="94" font-size="11.5" font-weight="bold" fill="#5f6b7a">Based on</text>
<text x="10" y="113" font-size="12" fill="#14335a">Survey returns from commissioners,</text>
<text x="10" y="130" font-size="12" fill="#14335a">SARCs and voluntary organisations,</text>
<text x="10" y="147" font-size="12" fill="#14335a">2014/15</text>
<text x="10" y="180" font-size="11.5" font-weight="bold" fill="#5f6b7a">Shows</text>
<text x="10" y="199" font-size="12" font-weight="bold" fill="#14335a">Historical contracts, grants</text>
<text x="10" y="216" font-size="12" font-weight="bold" fill="#14335a">and budgets</text>
<line x1="250" y1="14" x2="470" y2="14" stroke="#14335a" stroke-width="1.75"/>
<text x="250" y="42" font-size="16" font-weight="bold" fill="#14335a">Policy-based allocation</text>
<text x="250" y="62" font-size="12.5" font-style="italic" fill="#5f6b7a">Who should pay, by policy?</text>
<text x="250" y="94" font-size="11.5" font-weight="bold" fill="#5f6b7a">Based on</text>
<text x="250" y="113" font-size="12" fill="#14335a">Statutory responsibilities and</text>
<text x="250" y="130" font-size="12" fill="#14335a">national policy, applied to the</text>
<text x="250" y="147" font-size="12" fill="#14335a">total cost</text>
<text x="250" y="180" font-size="11.5" font-weight="bold" fill="#5f6b7a">Shows</text>
<text x="250" y="199" font-size="12" font-weight="bold" fill="#14335a">Responsibilities as written</text>
<line x1="490" y1="14" x2="710" y2="14" stroke="#14335a" stroke-width="1.75"/>
<circle cx="702" cy="14" r="6.5" fill="#c9a24a"/>
<text x="490" y="42" font-size="16" font-weight="bold" fill="#14335a">Pathway-based allocation</text>
<text x="490" y="62" font-size="12.5" font-style="italic" fill="#5f6b7a">Who should pay, by need?</text>
<text x="490" y="94" font-size="11.5" font-weight="bold" fill="#5f6b7a">Based on</text>
<text x="490" y="113" font-size="12" fill="#14335a">Each step of the 29 core pathways,</text>
<text x="490" y="130" font-size="12" fill="#14335a">allocated to the body responsible</text>
<text x="490" y="147" font-size="12" fill="#14335a">for the need it meets</text>
<text x="490" y="180" font-size="11.5" font-weight="bold" fill="#5f6b7a">Shows</text>
<text x="490" y="199" font-size="12" font-weight="bold" fill="#14335a">Funding that follows the</text>
<text x="490" y="216" font-size="12" font-weight="bold" fill="#14335a">victim's need</text>
<line x1="10" y1="250" x2="710" y2="250" stroke="#e3e6ea" stroke-width="1"/>
<text x="360" y="276" font-size="14" text-anchor="middle" font-weight="bold" fill="#14335a">Side by side, the three gave very different splits between the funding bodies</text>
</svg>
