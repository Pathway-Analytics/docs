<circle cx="56" cy="214" r="12" fill="#3f6b6e"/><text x="56" y="218.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">B</text>
<path d="M70 216 C150 236, 220 246, 260 246" fill="none" stroke="#518386" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M256.8 249.5 L264 246 L256.8 242.5" fill="none" stroke="#518386" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="272" y="251" font-size="14" fill="#3f6b6e">Clinic</text>
<text x="272" y="267" font-size="12" font-style="italic" fill="#3f6b6e">elsewhere</text>
<line x1="272" y1="275" x2="336" y2="275" stroke="#518386" stroke-width="1"/>
<line x1="24" y1="290" x2="150" y2="290" stroke="#518386" stroke-width="1.75"/>
<text x="24" y="314" font-size="15" fill="#3f6b6e">Pays for <tspan font-weight="bold">A + B</tspan></text>
</g>
<line x1="358" y1="6" x2="358" y2="318" stroke="#e3e6ea" stroke-width="1"/>
<line x1="10" y1="334" x2="710" y2="334" stroke="#e3e6ea" stroke-width="1"/>
<circle cx="22" cy="360" r="10" fill="#5f6b7a"/><text x="22" y="364" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">A</text><text x="39" y="364.5" font-size="12" fill="#14335a">Local residents, local clinics</text>
<circle cx="254" cy="360" r="10" fill="#5f6b7a"/><text x="254" y="364" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">B</text><text x="271" y="364.5" font-size="12" fill="#14335a">Local residents, clinics elsewhere</text>
<circle cx="508" cy="360" r="10" fill="#5f6b7a"/><text x="508" y="364" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">C</text><text x="525" y="364.5" font-size="12" fill="#14335a">Visitors, local clinics</text>
</svg>
