<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" width="720" height="378" role="img" aria-label="Under hosted funding a commissioner pays for everyone its local clinics see: local residents and visitors. Under de-hosted funding it pays for its own residents, wherever they are seen." font-family="Arial, Helvetica, sans-serif">
<title>Under hosted funding a commissioner pays for everyone its local clinics see: local residents and visitors. Under de-hosted funding it pays for its own residents, wherever they are seen.</title>
<rect width="720" height="378" fill="#ffffff"/>
<g transform="translate(0,0)">
<text x="10" y="16" font-size="13" font-weight="bold" fill="#14335a">Hosted funding</text>
<text x="10" y="37" font-size="12.5" fill="#5f6b7a">Pays for everyone its local clinics see</text>
<text x="14" y="70" font-size="12" font-style="italic" fill="#5f6b7a">Elsewhere</text>
<rect x="24.5" y="82.5" width="220" height="166" rx="4" fill="none" stroke="#14335a" stroke-width="1.25"/>
<text x="40" y="104" font-size="12" font-weight="bold" fill="#14335a">Commissioner's area</text>
<circle cx="56" cy="146" r="12" fill="#14335a"/><text x="56" y="150.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">A</text>
<path d="M70 146 C94 140, 110 142, 124 145" fill="none" stroke="#14335a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M119.5 147.8 L127 145 L120.1 140.9" fill="none" stroke="#14335a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="136" y="151" font-size="15" fill="#14335a">Local clinics</text>
<line x1="136" y1="158" x2="226" y2="158" stroke="#14335a" stroke-width="1.25"/>
<circle cx="300" cy="118" r="12" fill="#14335a"/><text x="300" y="122.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">C</text>
<path d="M287 124 C268 132, 250 138, 236 144" fill="none" stroke="#14335a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M237.5 138.4 L233 145 L241.0 144.4" fill="none" stroke="#14335a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="56" cy="214" r="12" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.25"/><text x="56" y="218.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#5f6b7a">B</text>
<path d="M70 216 C150 236, 220 246, 260 246" fill="none" stroke="#5f6b7a" stroke-width="1.25" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="round"/><path d="M256.8 249.5 L264 246 L256.8 242.5" fill="none" stroke="#5f6b7a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<text x="272" y="251" font-size="14" fill="#5f6b7a">Clinic</text>
<text x="272" y="267" font-size="12" font-style="italic" fill="#5f6b7a">elsewhere</text>
<line x1="272" y1="275" x2="336" y2="275" stroke="#5f6b7a" stroke-width="1"/>
<line x1="24" y1="290" x2="150" y2="290" stroke="#14335a" stroke-width="1.75"/>
<text x="24" y="314" font-size="15" fill="#14335a">Pays for <tspan font-weight="bold">A + C</tspan></text>
</g>
<g transform="translate(366,0)">
<text x="10" y="16" font-size="13" font-weight="bold" fill="#3f6b6e">De-hosted funding</text>
<text x="10" y="37" font-size="12.5" fill="#5f6b7a">Pays for its own residents, wherever they are seen</text>
<text x="14" y="70" font-size="12" font-style="italic" fill="#5f6b7a">Elsewhere</text>
<rect x="24.5" y="82.5" width="220" height="166" rx="4" fill="none" stroke="#518386" stroke-width="1.25"/>
