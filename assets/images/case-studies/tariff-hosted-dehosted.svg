<path d="M70 146 C94 140, 110 142, 124 145" fill="none" stroke="#518386" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M119.5 147.8 L127 145 L120.1 140.9" fill="none" stroke="#518386" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="136" y="151" font-size="15" fill="#3f6b6e">Local clinics</text>
