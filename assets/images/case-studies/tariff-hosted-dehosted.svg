<circle cx="300" cy="118" r="12" fill="#ffffff" stroke="#5f6b7a" stroke-width="1.25"/><text x="300" y="122.5" font-size="12" text-anchor="middle" font-weight="bold" fill="#5f6b7a">C</text>
