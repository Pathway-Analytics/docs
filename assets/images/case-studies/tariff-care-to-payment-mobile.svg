<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 360 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="212" width="360" height="248" rx="6" fill="#faf6ec"/>
  <text x="0" y="14" font-size="12" fill="#14335a" font-weight="600" letter-spacing="1">PROVIDER</text>
  <rect x="0" y="24" width="360" height="56" rx="6" fill="#14335a"/>
  <text x="14" y="47" font-size="15" fill="#fff" font-weight="600">1  Care activity</text>
  <text x="14" y="67" font-size="13" fill="#dfe6ef">Care delivered and recorded as usual</text>
  <path d="M172 80 L180 89 L188 80 Z" fill="#14335a"/>
  <rect x="0" y="92" width="360" height="56" rx="6" fill="#14335a"/>
  <text x="14" y="115" font-size="15" fill="#fff" font-weight="600">2  Coding</text>
  <text x="14" y="135" font-size="13" fill="#dfe6ef">GUMCAD and SRHAD, plus a few local codes</text>
  <text x="0" y="172" font-size="13" fill="#1f2933">No change to how clinicians deliver care;</text>
  <text x="0" y="191" font-size="13" fill="#1f2933">no direct patient identifiers leave the provider</text>
  <line x1="0" y1="212" x2="360" y2="212" stroke="#8a929c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="10" y="236" font-size="12" fill="#8a6a22" font-weight="600" letter-spacing="1">TARIFF GROUPER</text>
  <rect x="10" y="246" width="340" height="56" rx="6" fill="#c9a24a"/>
  <text x="24" y="269" font-size="15" fill="#14335a" font-weight="600">3  Grouping</text>
  <text x="24" y="289" font-size="13" fill="#14335a">Visits matched to currencies and prices</text>
  <path d="M172 302 L180 311 L188 302 Z" fill="#c9a24a"/>
  <rect x="10" y="314" width="340" height="56" rx="6" fill="#c9a24a"/>
  <text x="24" y="337" font-size="15" fill="#14335a" font-weight="600">4  Charging</text>
  <text x="24" y="357" font-size="13" fill="#14335a">Charges allocated to the council that pays</text>
  <text x="10" y="394" font-size="13" fill="#1f2933">Joins the two datasets into visits</text>
  <text x="10" y="413" font-size="13" fill="#1f2933">Removes double counting</text>
  <text x="10" y="432" font-size="13" fill="#1f2933">Primary price first, Additional for the rest</text>
  <text x="10" y="451" font-size="13" fill="#1f2933">Applies MFF or geographical weighting</text>
</svg>
