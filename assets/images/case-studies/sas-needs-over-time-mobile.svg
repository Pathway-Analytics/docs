<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 438" width="360" height="438" role="img" aria-label="Three illustrative victims and their level of need at each of nine steps, from initial contact to later counselling. An adult is acute from initial contact to verbal evidence, complex for needs assessment and follow-up support, vulnerable for counselling and court support, and ongoing for later counselling. An adolescent is vulnerable at initial contact, risk assessment, needs assessment and counselling, does not need the other steps, and is ongoing for later counselling. A child is acute at every step." font-family="Arial, Helvetica, sans-serif">
<title>Three illustrative victims and their level of need at each of nine steps, from initial contact to later counselling. An adult is acute from initial contact to verbal evidence, complex for needs assessment and follow-up support, vulnerable for counselling and court support, and ongoing for later counselling. An adolescent is vulnerable at initial contact, risk assessment, needs assessment and counselling, does not need the other steps, and is ongoing for later counselling. A child is acute at every step.</title>
<rect width="360" height="438" fill="#ffffff"/>
<text x="12" y="16" font-size="12" font-weight="bold" fill="#5f6b7a">Level of need at each step</text>
<text x="186" y="44" font-size="12" text-anchor="middle" font-weight="bold" fill="#14335a">Adult</text>
<text x="186" y="59" font-size="10.5" text-anchor="middle" fill="#5f6b7a">18 and over</text>
<text x="254" y="44" font-size="12" text-anchor="middle" font-weight="bold" fill="#14335a">Adolescent</text>
<text x="254" y="59" font-size="10.5" text-anchor="middle" fill="#5f6b7a">13 to 17</text>
<text x="322" y="44" font-size="12" text-anchor="middle" font-weight="bold" fill="#14335a">Child</text>
<text x="322" y="59" font-size="10.5" text-anchor="middle" fill="#5f6b7a">12 and under</text>
<line x1="12" y1="68" x2="354" y2="68" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="96" font-size="11.5" fill="#14335a">Initial contact</text>
<text x="12" y="126" font-size="11.5" fill="#14335a">Risk assessment</text>
<text x="12" y="156" font-size="11.5" fill="#14335a">Forensic examination</text>
<text x="12" y="186" font-size="11.5" fill="#14335a">Verbal evidence</text>
<text x="12" y="216" font-size="11.5" fill="#14335a">Needs assessment</text>
<text x="12" y="246" font-size="11.5" fill="#14335a">Follow-up support</text>
<text x="12" y="276" font-size="11.5" fill="#14335a">Counselling</text>
<text x="12" y="306" font-size="11.5" fill="#14335a">Court support</text>
<text x="12" y="336" font-size="11.5" fill="#14335a">Later counselling</text>
<rect x="154" y="78" width="64" height="118" fill="#14335a"/>
<text x="186" y="141" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">Acute</text>
<rect x="154" y="198" width="64" height="58" fill="#25497c"/>
<text x="186" y="231" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">Complex</text>
<rect x="154" y="258" width="64" height="58" fill="#3e6aa0"/>
<text x="186" y="291" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">Vulnerable</text>
<rect x="154" y="318" width="64" height="28" fill="#8fabcf"/>
<text x="186" y="336" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">Ongoing</text>
<rect x="222" y="78" width="64" height="58" fill="#3e6aa0"/>
<text x="254" y="111" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">Vulnerable</text>
<rect x="222.5" y="138.5" width="63" height="27" fill="#ffffff" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="3 2.5"/>
<rect x="222.5" y="168.5" width="63" height="27" fill="#ffffff" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="3 2.5"/>
<rect x="222" y="198" width="64" height="28" fill="#3e6aa0"/>
<text x="254" y="216" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">Vulnerable</text>
<rect x="222.5" y="228.5" width="63" height="27" fill="#ffffff" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="3 2.5"/>
<rect x="222" y="258" width="64" height="28" fill="#3e6aa0"/>
<text x="254" y="276" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">Vulnerable</text>
<rect x="222.5" y="288.5" width="63" height="27" fill="#ffffff" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="3 2.5"/>
<rect x="222" y="318" width="64" height="28" fill="#8fabcf"/>
<text x="254" y="336" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">Ongoing</text>
<rect x="290" y="78" width="64" height="268" fill="#14335a"/>
<text x="322" y="216" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">Acute</text>
<line x1="12" y1="356" x2="354" y2="356" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="380" font-size="12" fill="#5f6b7a">Level of need, lowest to highest:</text>
<rect x="12" y="392" width="13" height="13" fill="#8fabcf"/><text x="31" y="403" font-size="12" fill="#14335a">Ongoing</text>
<rect x="110" y="392" width="13" height="13" fill="#3e6aa0"/><text x="129" y="403" font-size="12" fill="#14335a">Vulnerable</text>
<rect x="214" y="392" width="13" height="13" fill="#25497c"/><text x="233" y="403" font-size="12" fill="#14335a">Complex</text>
<rect x="12" y="416" width="13" height="13" fill="#14335a"/><text x="31" y="427" font-size="12" fill="#14335a">Acute</text>
<rect x="110.5" y="416.5" width="12" height="12" fill="#ffffff" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="3 2"/><text x="129" y="427" font-size="12" fill="#5f6b7a">Step not needed</text>
</svg>
