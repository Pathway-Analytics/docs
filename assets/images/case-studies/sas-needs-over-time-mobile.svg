<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 462" role="img" aria-label="Three illustrative victims and their level of need at each of nine steps: an adult moves from acute to complex, vulnerable and ongoing; an adolescent is vulnerable at some steps and does not need others; a child is acute throughout." font-family="Arial, Helvetica, sans-serif">
<rect width="360" height="462" fill="#FFFFFF"/>
