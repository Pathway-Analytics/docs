<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="720" height="254" role="img" aria-label="One visit, historical tariff prices: the LARC procedure is paid at its Primary price of £114.88 and SRH standard at its Additional price of £31.91, a total of £146.79, rather than £165.41 if both were paid at their Primary price. The £18.62 difference is shared care, not paid twice." font-family="Arial, Helvetica, sans-serif">
<title>One visit, historical tariff prices: the LARC procedure is paid at its Primary price of £114.88 and SRH standard at its Additional price of £31.91, a total of £146.79, rather than £165.41 if both were paid at their Primary price. The £18.62 difference is shared care, not paid twice.</title>
<rect width="720" height="254" fill="#ffffff"/>
<text x="10" y="14" font-size="12" font-weight="bold" fill="#5f6b7a">One visit: a change from the pill to a long-acting method</text>
<line x1="10" y1="26" x2="710" y2="26" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="60" font-size="16" font-weight="bold" fill="#14335a">Worked example, historical tariff prices</text>
<rect x="10" y="70" width="344.64" height="30" fill="#14335a"/>
<text x="22" y="90" font-size="12.5" fill="#ffffff">LARC procedure · Primary £114.88</text>
<rect x="354.64" y="70" width="95.73" height="30" fill="#3f6b6e"/>
<rect x="451.12" y="70.75" width="54.36" height="28.5" fill="#ffffff" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="478.3" y="90" font-size="11.5" text-anchor="middle" font-weight="bold" fill="#7a5c1a">£18.62</text>
<text x="450.37" y="60" font-size="20" text-anchor="end" font-weight="bold" fill="#14335a">£146.79</text>
<line x1="450.37" y1="64" x2="450.37" y2="70" stroke="#14335a" stroke-width="1.5"/>
<line x1="402.505" y1="100" x2="402.505" y2="108" stroke="#3f6b6e" stroke-width="1.25"/>
<text x="402.505" y="122" font-size="12" text-anchor="middle" fill="#3f6b6e">SRH standard · Additional £31.91</text>
<text x="10" y="156" font-size="13" fill="#5f6b7a">If both currencies were paid at their Primary price</text>
<rect x="10.5" y="168.5" width="343.64" height="29" fill="#f4f6f8" stroke="#5f6b7a" stroke-width="1"/>
<text x="22" y="188" font-size="12.5" fill="#5f6b7a">LARC procedure £114.88</text>
<rect x="355.14" y="168.5" width="150.59" height="29" fill="#ffffff" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="366.64" y="188" font-size="12.5" fill="#5f6b7a">SRH standard £50.53</text>
<text x="522.23" y="189" font-size="20" font-weight="bold" fill="#5f6b7a">£165.41</text>
<line x1="450.37" y1="206" x2="506.23" y2="206" stroke="#c9a24a" stroke-width="1.5"/>
<line x1="450.37" y1="201" x2="450.37" y2="211" stroke="#c9a24a" stroke-width="1.5"/>
<line x1="506.23" y1="201" x2="506.23" y2="211" stroke="#c9a24a" stroke-width="1.5"/>
<text x="450.37" y="228" font-size="12.5" font-weight="bold" fill="#7a5c1a">£18.62 of shared care,</text>
<text x="450.37" y="245" font-size="12.5" font-weight="bold" fill="#7a5c1a">not paid twice</text>
</svg>
