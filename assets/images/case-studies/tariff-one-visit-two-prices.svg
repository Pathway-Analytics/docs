<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <text x="0" y="16" font-size="12" font-weight="600" fill="#5f6b7a" letter-spacing="1">ONE VISIT: A CHANGE FROM THE PILL TO A LONG-ACTING METHOD</text>
  <!-- scale: £1 = 3px -->

  <!-- Integrated tariff -->
  <text x="0" y="52" font-size="12.5" fill="#14335a" font-weight="600">Worked example, historical tariff prices</text>
  <rect x="0" y="62" width="344.6" height="30" fill="#14335a"/>
  <text x="10" y="82" font-size="11.5" fill="#fff">LARC procedure · Primary £114.88</text>
  <rect x="344.6" y="62" width="95.7" height="30" fill="#46777a"/>
  <rect x="440.3" y="62" width="55.9" height="30" fill="#f9eeda" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="468.2" y="82" font-size="11" fill="#7a5c1a" text-anchor="middle" font-weight="600">£18.62</text>
  <text x="440.3" y="54" font-size="14" fill="#14335a" font-weight="600" text-anchor="middle">£146.79</text>
  <line x1="440.3" y1="58" x2="440.3" y2="62" stroke="#14335a" stroke-width="1.5"/>
  <text x="436" y="108" font-size="11" fill="#3f6b6e" text-anchor="end">SRH standard · Additional £31.91</text>

  <!-- Full price -->
  <text x="0" y="138" font-size="12.5" fill="#5f6b7a" font-weight="600">If both currencies were paid at their Primary price</text>
  <rect x="0" y="148" width="344.6" height="30" fill="#d9dde2"/>
  <text x="10" y="168" font-size="11.5" fill="#5f6b7a">LARC procedure £114.88</text>
  <rect x="344.6" y="148" width="151.6" height="30" fill="#eef0f2" stroke="#c4cad1" stroke-dasharray="3 3"/>
  <text x="352" y="168" font-size="11" fill="#5f6b7a">SRH standard £50.53</text>
  <text x="508" y="168" font-size="14" fill="#5f6b7a">£165.41</text>

  <!-- Guides -->
  <line x1="440.3" y1="96" x2="440.3" y2="148" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="440.3" y1="174" x2="440.3" y2="186" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="496.2" y1="96" x2="496.2" y2="182" stroke="#c9a24a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="440.3" y="200" font-size="11.5" fill="#7a5c1a" font-weight="600">£18.62 of shared care,</text>
  <text x="440.3" y="215" font-size="11.5" fill="#7a5c1a" font-weight="600">not paid twice</text>
  </svg>
