<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img" aria-label="The national budgetary assessment in four steps: national surveys of commissioners, SARC managers and voluntary organisations in August and September 2014; pathway workshops in October 2014 that mapped 72 good-practice pathways; agreement in November 2014 on 29 core pathways; and a funding model in December 2014 and January 2015 sharing the modelled cost between six public bodies." font-family="Arial, Helvetica, sans-serif">
<title>The national budgetary assessment in four steps: national surveys of commissioners, SARC managers and voluntary organisations in August and September 2014; pathway workshops in October 2014 that mapped 72 good-practice pathways; agreement in November 2014 on 29 core pathways; and a funding model in December 2014 and January 2015 sharing the modelled cost between six public bodies.</title>
<rect width="720" height="272" fill="#ffffff"/>
<line x1="10" y1="46" x2="700" y2="46" stroke="#14335a" stroke-width="1.75"/>
<path d="M698.8 49.5 L706 46 L698.8 42.5" fill="none" stroke="#14335a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="16" cy="46" r="5" fill="#518386"/>
<text x="10" y="26" font-size="12" font-weight="bold" fill="#3f6b6e">Aug to Sep 2014</text>
<text x="10" y="82" font-size="16" font-weight="bold" fill="#14335a">National survey</text>
<text x="10" y="104" font-size="11.5" fill="#5f6b7a">Commissioners, SARC managers</text>
<text x="10" y="120" font-size="11.5" fill="#5f6b7a">and voluntary organisations</text>
<line x1="10" y1="162" x2="170" y2="162" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="196" font-size="28" font-weight="bold" fill="#14335a">3</text>
<text x="10" y="218" font-size="11.5" fill="#14335a">national surveys: funding,</text>
<text x="10" y="234" font-size="11.5" fill="#14335a">activity, case mix, staffing</text>
<text x="10" y="250" font-size="11.5" fill="#14335a">and costs</text>
<circle cx="196" cy="46" r="5" fill="#518386"/>
<text x="190" y="26" font-size="12" font-weight="bold" fill="#3f6b6e">Oct 2014</text>
<text x="190" y="82" font-size="16" font-weight="bold" fill="#14335a">Pathway workshops</text>
<text x="190" y="104" font-size="11.5" fill="#5f6b7a">100+ stakeholders, six areas</text>
<text x="190" y="120" font-size="11.5" fill="#5f6b7a">of England, 30+ hours</text>
<line x1="190" y1="162" x2="350" y2="162" stroke="#e3e6ea" stroke-width="1"/>
<text x="190" y="196" font-size="28" font-weight="bold" fill="#14335a">72</text>
<text x="190" y="218" font-size="11.5" fill="#14335a">good-practice pathways</text>
<text x="190" y="234" font-size="11.5" fill="#14335a">mapped</text>
<circle cx="376" cy="46" r="5" fill="#518386"/>
<text x="370" y="26" font-size="12" font-weight="bold" fill="#3f6b6e">Nov 2014</text>
<text x="370" y="82" font-size="16" font-weight="bold" fill="#14335a">Agree good practice</text>
<text x="370" y="104" font-size="11.5" fill="#5f6b7a">Four criteria: victim experience,</text>
<text x="370" y="120" font-size="11.5" fill="#5f6b7a">justice and health outcomes,</text>
<text x="370" y="136" font-size="11.5" fill="#5f6b7a">value for money</text>
<line x1="370" y1="162" x2="530" y2="162" stroke="#e3e6ea" stroke-width="1"/>
<text x="370" y="196" font-size="28" font-weight="bold" fill="#14335a">29</text>
<text x="370" y="218" font-size="11.5" fill="#14335a">core pathways agreed by a</text>
<text x="370" y="234" font-size="11.5" fill="#14335a">national governance group</text>
<circle cx="556" cy="46" r="6.5" fill="#c9a24a"/>
<text x="550" y="26" font-size="12" font-weight="bold" fill="#7a5c1a">Dec 2014 to Jan 2015</text>
<text x="550" y="82" font-size="16" font-weight="bold" fill="#14335a">Funding model</text>
<text x="550" y="104" font-size="11.5" fill="#5f6b7a">Each step costed and allocated</text>
<text x="550" y="120" font-size="11.5" fill="#5f6b7a">to the body responsible for</text>
<text x="550" y="136" font-size="11.5" fill="#5f6b7a">the need it meets</text>
<line x1="550" y1="162" x2="710" y2="162" stroke="#e3e6ea" stroke-width="1"/>
<text x="550" y="196" font-size="28" font-weight="bold" fill="#14335a">6</text>
<text x="550" y="218" font-size="11.5" fill="#14335a">public bodies share the</text>
<text x="550" y="234" font-size="11.5" fill="#14335a">modelled cost</text>
</svg>
