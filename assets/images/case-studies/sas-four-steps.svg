<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 352" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5f6b7a"/></marker>
  </defs>
  <text x="0" y="16" font-size="12" fill="#5f6b7a" font-weight="600" letter-spacing="1">THE NATIONAL BUDGETARY ASSESSMENT IN FOUR STEPS</text>
  <rect x="0" y="32" width="430" height="64" fill="#14335a" rx="6"/>
  <text x="18" y="72" font-size="26" fill="#c9a24a" font-weight="700">1</text>
  <text x="52" y="57" font-size="15" fill="#ffffff" font-weight="600">National survey</text>
  <text x="52" y="76" font-size="11.5" fill="#dfe6ef">Commissioners, SARC managers and</text>
  <text x="52" y="90" font-size="11.5" fill="#dfe6ef">voluntary organisations</text>
  <text x="416" y="56" font-size="10.5" fill="#c9d3e0" text-anchor="end">Aug to Sep 2014</text>
  <rect x="440" y="32" width="196" height="64" fill="#f4f6f8" rx="6"/>
  <text x="454" y="62" font-size="24" fill="#14335a" font-weight="700">3</text>
  <text x="454" y="78" font-size="10.5" fill="#5f6b7a">national surveys: funding, activity,</text>
  <text x="454" y="90.5" font-size="10.5" fill="#5f6b7a">case mix, staffing and costs</text>
  <line x1="40" y1="98" x2="40" y2="109" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="26" y="112" width="430" height="64" fill="#14335a" rx="6"/>
  <text x="44" y="152" font-size="26" fill="#c9a24a" font-weight="700">2</text>
  <text x="78" y="137" font-size="15" fill="#ffffff" font-weight="600">Pathway workshops</text>
  <text x="78" y="156" font-size="11.5" fill="#dfe6ef">100+ stakeholders, six areas of England,</text>
  <text x="78" y="170" font-size="11.5" fill="#dfe6ef">30+ hours of mapping</text>
  <text x="442" y="136" font-size="10.5" fill="#c9d3e0" text-anchor="end">Oct 2014</text>
  <rect x="466" y="112" width="196" height="64" fill="#f4f6f8" rx="6"/>
  <text x="480" y="142" font-size="24" fill="#14335a" font-weight="700">72</text>
  <text x="480" y="158" font-size="10.5" fill="#5f6b7a">good-practice pathways</text>
  <text x="480" y="170.5" font-size="10.5" fill="#5f6b7a">mapped</text>
  <line x1="66" y1="178" x2="66" y2="189" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="52" y="192" width="430" height="64" fill="#14335a" rx="6"/>
  <text x="70" y="232" font-size="26" fill="#c9a24a" font-weight="700">3</text>
  <text x="104" y="217" font-size="15" fill="#ffffff" font-weight="600">Agree good practice</text>
  <text x="104" y="236" font-size="11.5" fill="#dfe6ef">Four criteria: victim experience, justice</text>
  <text x="104" y="250" font-size="11.5" fill="#dfe6ef">outcomes, health outcomes, value for money</text>
  <text x="468" y="216" font-size="10.5" fill="#c9d3e0" text-anchor="end">Nov 2014</text>
  <rect x="492" y="192" width="196" height="64" fill="#f4f6f8" rx="6"/>
  <text x="506" y="222" font-size="24" fill="#14335a" font-weight="700">29</text>
  <text x="506" y="238" font-size="10.5" fill="#5f6b7a">core pathways agreed by</text>
  <text x="506" y="250.5" font-size="10.5" fill="#5f6b7a">a national governance group</text>
  <line x1="92" y1="258" x2="92" y2="269" stroke="#5f6b7a" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="78" y="272" width="430" height="64" fill="#14335a" rx="6"/>
  <text x="96" y="312" font-size="26" fill="#c9a24a" font-weight="700">4</text>
  <text x="130" y="297" font-size="15" fill="#ffffff" font-weight="600">Funding model</text>
  <text x="130" y="316" font-size="11.5" fill="#dfe6ef">Each step costed and allocated to the</text>
  <text x="130" y="330" font-size="11.5" fill="#dfe6ef">body responsible for the need it meets</text>
  <text x="494" y="296" font-size="10.5" fill="#c9d3e0" text-anchor="end">Dec 2014 to Jan 2015</text>
  <rect x="518" y="272" width="196" height="64" fill="#f4f6f8" rx="6"/>
  <text x="532" y="302" font-size="24" fill="#14335a" font-weight="700">6</text>
  <text x="532" y="318" font-size="10.5" fill="#5f6b7a">public bodies share the</text>
  <text x="532" y="330.5" font-size="10.5" fill="#5f6b7a">modelled cost</text>
</svg>
