<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="From three clinical targets to the whole pathway. The HIV care cascade, 2020 and 2030. The conventional 2020 cascade measures three stages against the UNAIDS 90-90-90 targets: testing, entry into care, and ongoing treatment and care. London's 2016 figures: 90% of people living with HIV diagnosed, 97% of those diagnosed on treatment, 97% of those on treatment virally suppressed. Prevention was not measured. Pathway Analytics extended the cascade for London's 2030 ambitions: prevention is added as the first stage, with zero new infections and people living with HIV living well across the whole pathway, zero HIV-related deaths from testing onwards, and zero stigma and discrimination across every stage." font-family="Arial, Helvetica, sans-serif">
<title>From three clinical targets to the whole pathway. The HIV care cascade, 2020 and 2030. The conventional 2020 cascade measures three stages against the UNAIDS 90-90-90 targets: testing, entry into care, and ongoing treatment and care. London's 2016 figures: 90% of people living with HIV diagnosed, 97% of those diagnosed on treatment, 97% of those on treatment virally suppressed. Prevention was not measured. Pathway Analytics extended the cascade for London's 2030 ambitions: prevention is added as the first stage, with zero new infections and people living with HIV living well across the whole pathway, zero HIV-related deaths from testing onwards, and zero stigma and discrimination across every stage.</title>
<rect width="720" height="460" fill="#ffffff"/>
<text x="10" y="20" font-size="15" font-weight="bold" fill="#14335a">From three clinical targets to the whole pathway</text>
<text x="10" y="46" font-size="12" font-weight="bold" fill="#5f6b7a">2020: three clinical targets, UNAIDS 90–90–90</text>
<polygon points="10,108 10,58 171,58 181,83 171,108" fill="none" stroke="#5f6b7a" stroke-width="1.25" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="95" y="80" font-size="14" text-anchor="middle" font-weight="bold" fill="#5f6b7a">Prevention</text>
<text x="95" y="96" font-size="14" text-anchor="middle" font-weight="bold" fill="#5f6b7a">not measured</text>
<polygon points="187,108 197,83 187,58 345,58 355,83 345,108" fill="#14335a"/>
<text x="275" y="88" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Testing</text>
<polygon points="361,108 371,83 361,58 519,58 529,83 519,108" fill="#14335a"/>
<text x="449" y="88" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Entry into care</text>
<polygon points="535,108 545,83 535,58 693,58 703,83 693,108" fill="#14335a"/>
<text x="623" y="80" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Ongoing treatment</text>
<text x="623" y="96" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">and care</text>
<text x="200" y="144" font-size="28" font-weight="bold" fill="#14335a">90%</text>
<text x="200" y="163" font-size="12" font-weight="bold" fill="#14335a">diagnosed</text>
<text x="200" y="178" font-size="11.5" fill="#5f6b7a">of people living with HIV</text>
<text x="374" y="144" font-size="28" font-weight="bold" fill="#14335a">97%</text>
<text x="374" y="163" font-size="12" font-weight="bold" fill="#14335a">on treatment</text>
<text x="374" y="178" font-size="11.5" fill="#5f6b7a">of those diagnosed</text>
<text x="548" y="144" font-size="28" font-weight="bold" fill="#14335a">97%</text>
<text x="548" y="163" font-size="12" font-weight="bold" fill="#14335a">virally suppressed</text>
<text x="548" y="178" font-size="11.5" fill="#5f6b7a">of those on treatment</text>
<text x="10" y="144" font-size="12" font-weight="bold" fill="#5f6b7a">London, 2016</text>
<text x="10" y="163" font-size="11.5" fill="#5f6b7a">Target: 90% at</text>
<text x="10" y="178" font-size="11.5" fill="#5f6b7a">each stage</text>
<line x1="10" y1="200" x2="703" y2="200" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="226" font-size="12" font-weight="bold" fill="#3f6b6e">2030: the whole pathway, as extended by Pathway Analytics</text>
<polygon points="10,306 10,256 171,256 181,281 171,306" fill="#3f6b6e"/>
<text x="95" y="286" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Prevention</text>
<polygon points="187,306 197,281 187,256 345,256 355,281 345,306" fill="#14335a"/>
<text x="275" y="286" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Testing</text>
<polygon points="361,306 371,281 361,256 519,256 529,281 519,306" fill="#14335a"/>
<text x="449" y="286" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Entry into care</text>
<polygon points="535,306 545,281 535,256 693,256 703,281 693,306" fill="#14335a"/>
<text x="623" y="278" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">Ongoing treatment</text>
<text x="623" y="294" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">and care</text>
<text x="18" y="250" font-size="11.5" font-weight="bold" fill="#3f6b6e">Added</text>
<rect x="10" y="316" width="693" height="26" fill="#f4f6f8"/>
<rect x="10" y="316" width="4" height="26" fill="#3f6b6e"/>
<text x="24" y="333.5" font-size="13" font-weight="bold" fill="#3f6b6e">Zero new infections</text>
<rect x="187" y="348" width="516" height="26" fill="#f4f6f8"/>
<rect x="187" y="348" width="4" height="26" fill="#3f6b6e"/>
<text x="201" y="365.5" font-size="13" font-weight="bold" fill="#3f6b6e">Zero HIV-related deaths</text>
<rect x="10" y="380" width="693" height="26" fill="#f4f6f8"/>
<rect x="10" y="380" width="4" height="26" fill="#3f6b6e"/>
<text x="24" y="397.5" font-size="13" font-weight="bold" fill="#3f6b6e">People living with HIV living well</text>
<polygon points="10,416 685,416 703,431 685,446 10,446" fill="#3f6b6e"/>
<text x="24" y="436" font-size="13.5" font-weight="bold" fill="#ffffff">Zero stigma and discrimination, addressed at every stage</text>
</svg>
