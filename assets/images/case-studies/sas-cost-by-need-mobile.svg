<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 402" width="360" height="402" role="img" aria-label="Costing a client pathway: each component is costed at four levels of need, from ongoing to acute, with relative costs rising from one to four pound signs. Ongoing clients need no verbal evidence or forensic examination. Choosing a level, here vulnerable, gives the cost of one client's pathway at that level." font-family="Arial, Helvetica, sans-serif">
<title>Costing a client pathway: each component is costed at four levels of need, from ongoing to acute, with relative costs rising from one to four pound signs. Ongoing clients need no verbal evidence or forensic examination. Choosing a level, here vulnerable, gives the cost of one client's pathway at that level.</title>
<rect width="360" height="402" fill="#ffffff"/>
<rect x="190" y="30" width="54" height="244" fill="#f4f6f8"/>
<circle cx="201" cy="16" r="6.5" fill="#c9a24a"/>
<text x="212" y="20.5" font-size="11.5" font-weight="bold" fill="#7a5c1a">Level chosen</text>
<text x="12" y="56" font-size="11" font-weight="bold" fill="#5f6b7a">Level of need</text>
<text x="163" y="56" font-size="10" text-anchor="middle" font-weight="bold" fill="#14335a">Ongoing</text>
<rect x="141" y="62" width="44" height="4" fill="#8fabcf"/>
<text x="217" y="56" font-size="10" text-anchor="middle" font-weight="bold" fill="#14335a">Vulnerable</text>
<rect x="195" y="62" width="44" height="4" fill="#3e6aa0"/>
<text x="271" y="56" font-size="10" text-anchor="middle" font-weight="bold" fill="#14335a">Complex</text>
<rect x="249" y="62" width="44" height="4" fill="#25497c"/>
<text x="325" y="56" font-size="10" text-anchor="middle" font-weight="bold" fill="#14335a">Acute</text>
<rect x="303" y="62" width="44" height="4" fill="#14335a"/>
<line x1="12" y1="74" x2="352" y2="74" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="99" font-size="12.5" fill="#14335a">Initial contact</text>
<text x="163" y="99" font-size="13" text-anchor="middle" fill="#14335a">£</text>
<text x="217" y="99" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="271" y="99" font-size="13" text-anchor="middle" fill="#14335a">£££</text>
<text x="325" y="99" font-size="13" text-anchor="middle" fill="#14335a">££££</text>
<line x1="12" y1="114" x2="352" y2="114" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="139" font-size="12.5" fill="#14335a">Risk assessment</text>
<text x="163" y="139" font-size="13" text-anchor="middle" fill="#14335a">£</text>
<text x="217" y="139" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="271" y="139" font-size="13" text-anchor="middle" fill="#14335a">£££</text>
<text x="325" y="139" font-size="13" text-anchor="middle" fill="#14335a">££££</text>
<line x1="12" y1="154" x2="352" y2="154" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="179" font-size="12.5" fill="#14335a">Verbal evidence</text>
<text x="163" y="172" font-size="10" text-anchor="middle" font-style="italic" fill="#5f6b7a">Not</text>
<text x="163" y="184" font-size="10" text-anchor="middle" font-style="italic" fill="#5f6b7a">needed</text>
<text x="217" y="179" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="271" y="179" font-size="13" text-anchor="middle" fill="#14335a">£££</text>
<text x="325" y="179" font-size="13" text-anchor="middle" fill="#14335a">££££</text>
<line x1="12" y1="194" x2="352" y2="194" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="211" font-size="12.5" fill="#14335a">Forensic</text>
<text x="12" y="226" font-size="12.5" fill="#14335a">examination</text>
<text x="163" y="212" font-size="10" text-anchor="middle" font-style="italic" fill="#5f6b7a">Not</text>
<text x="163" y="224" font-size="10" text-anchor="middle" font-style="italic" fill="#5f6b7a">needed</text>
<text x="217" y="219" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="271" y="219" font-size="13" text-anchor="middle" fill="#14335a">£££</text>
<text x="325" y="219" font-size="13" text-anchor="middle" fill="#14335a">££££</text>
<line x1="12" y1="234" x2="352" y2="234" stroke="#e3e6ea" stroke-width="1"/>
<text x="12" y="259" font-size="12.5" fill="#14335a">Needs assessment</text>
<text x="163" y="259" font-size="13" text-anchor="middle" fill="#14335a">£</text>
<text x="217" y="259" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="271" y="259" font-size="13" text-anchor="middle" fill="#14335a">£££</text>
<text x="325" y="259" font-size="13" text-anchor="middle" fill="#14335a">££££</text>
<line x1="12" y1="274" x2="352" y2="274" stroke="#e3e6ea" stroke-width="1"/>
<line x1="217" y1="274" x2="217" y2="296" stroke="#c9a24a" stroke-width="1.75"/>
<path d="M213.5 292.8 L217 300 L220.5 292.8" fill="none" stroke="#c9a24a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="12" y="324" font-size="14" font-weight="bold" fill="#14335a">Cost of one client's pathway</text>
<text x="12" y="342" font-size="14" font-weight="bold" fill="#14335a">at this level</text>
<text x="12" y="372" font-size="12" fill="#5f6b7a">Higher need adds staff time, specialist input</text>
<text x="12" y="389" font-size="12" fill="#5f6b7a">such as interpreters, and sometimes extra steps</text>
</svg>
