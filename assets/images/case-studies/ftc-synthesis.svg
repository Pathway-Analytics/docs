<text x="260" y="206" font-size="13" fill="#5f6b7a">theme along the pathway</text>
<rect x="510" y="138" width="200" height="4" fill="#518386"/>
<text x="510" y="168" font-size="20" font-weight="bold" fill="#3f6b6e">Impacts</text>
<text x="510" y="189" font-size="13" fill="#5f6b7a">consequences for people</text>
<text x="510" y="206" font-size="13" fill="#5f6b7a">and services</text>
