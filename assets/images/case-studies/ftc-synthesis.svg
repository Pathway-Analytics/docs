<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 418" width="720" height="418" role="img" aria-label="How each gap was tested. Stakeholder views were treated as hypotheses, not established facts, and tested against the evidence. Each gap, what is missing grouped by theme along the pathway, sits at the centre: its causes lead into it and its consequences for people and services follow from it. Above it, its significance, how much it matters. Below it, the evidence needed to test or prioritise it, drawn from three sources: published research, lived-experience evidence and stakeholder views. Questions the review could not settle were recommended to Public Health England for further analysis." font-family="Arial, Helvetica, sans-serif">
<title>How each gap was tested. Stakeholder views were treated as hypotheses, not established facts, and tested against the evidence. Each gap, what is missing grouped by theme along the pathway, sits at the centre: its causes lead into it and its consequences for people and services follow from it. Above it, its significance, how much it matters. Below it, the evidence needed to test or prioritise it, drawn from three sources: published research, lived-experience evidence and stakeholder views. Questions the review could not settle were recommended to Public Health England for further analysis.</title>
