<text x="282" y="66" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">Local</text>
<text x="282" y="79" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">authorities</text>
<text x="349" y="66" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">NHS England</text>
<text x="349" y="79" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">specialised</text>
<text x="416" y="53" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">NHS England</text>
<text x="416" y="66" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">justice</text>
<text x="416" y="79" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">health</text>
<text x="483" y="79" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">CCGs</text>
<text x="550" y="53" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">Public</text>
<text x="550" y="66" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">Health</text>
<text x="550" y="79" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">England</text>
<text x="617" y="66" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">Other</text>
<text x="617" y="79" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">funders</text>
<text x="684" y="66" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#5f6b7a">Unfunded</text>
<text x="684" y="79" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#5f6b7a">or unclear</text>
<line x1="10" y1="84" x2="710" y2="84" stroke="#14335a" stroke-width="1.25"/>
