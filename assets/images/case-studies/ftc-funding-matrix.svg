<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-label="Who funded each part of the HIV pathway in London in 2018. Prevention: general prevention by local authorities and Public Health England; PrEP in the Impact Trial by NHS England specialised commissioning; PrEP outside the trial by other funders, with funding unclear or absent; PrEP follow-up by local authorities and NHS England; treatment as prevention by NHS England, including justice health in prisons. Testing: screening in primary care, community and online settings by local authorities; in specialist clinics by local authorities and NHS England; in emergency care and general wards by NHS England and other funders, with gaps; in prisons by NHS England justice health; GP testing by clinical commissioning groups when clinically indicated and by NHS England when patient requested. Treatment and care: HIV clinics by NHS England; community nursing and peer support by four funders, with gaps; prison care by NHS England justice health and other funders; other health conditions and mental health by NHS England, clinical commissioning groups and other funders; drug and alcohol services and social care by several funders, with gaps." font-family="Arial, Helvetica, sans-serif">
<title>Who funded each part of the HIV pathway in London in 2018. Prevention: general prevention by local authorities and Public Health England; PrEP in the Impact Trial by NHS England specialised commissioning; PrEP outside the trial by other funders, with funding unclear or absent; PrEP follow-up by local authorities and NHS England; treatment as prevention by NHS England, including justice health in prisons. Testing: screening in primary care, community and online settings by local authorities; in specialist clinics by local authorities and NHS England; in emergency care and general wards by NHS England and other funders, with gaps; in prisons by NHS England justice health; GP testing by clinical commissioning groups when clinically indicated and by NHS England when patient requested. Treatment and care: HIV clinics by NHS England; community nursing and peer support by four funders, with gaps; prison care by NHS England justice health and other funders; other health conditions and mental health by NHS England, clinical commissioning groups and other funders; drug and alcohol services and social care by several funders, with gaps.</title>
