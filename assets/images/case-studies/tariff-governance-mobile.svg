<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 416" width="360" height="416" role="img" aria-label="Governance: the London Sexual Health Programme and its steering group oversaw four expert working groups: clinical, commissioning, data management and finance. Pathway Analytics provided methodology, modelling, analysis, coding and IT support for all four." font-family="Arial, Helvetica, sans-serif">
<title>Governance: the London Sexual Health Programme and its steering group oversaw four expert working groups: clinical, commissioning, data management and finance. Pathway Analytics provided methodology, modelling, analysis, coding and IT support for all four.</title>
<rect width="360" height="416" fill="#ffffff"/>
<text x="180" y="26" font-size="16" text-anchor="middle" font-weight="bold" fill="#14335a">London Sexual Health Programme</text>
<line x1="90" y1="38" x2="270" y2="38" stroke="#e3e6ea" stroke-width="1"/>
<line x1="180" y1="38" x2="180" y2="56" stroke="#518386" stroke-width="1.25"/>
<circle cx="180" cy="58" r="3" fill="#14335a"/>
<text x="180" y="84" font-size="16" text-anchor="middle" fill="#14335a">Steering group</text>
<text x="180" y="104" font-size="13" text-anchor="middle" fill="#5f6b7a">Including HPA, BASHH, FSRH and</text>
<text x="180" y="120" font-size="13" text-anchor="middle" fill="#5f6b7a">the DH Payment by Results team</text>
<line x1="180" y1="130" x2="180" y2="150" stroke="#518386" stroke-width="1.25"/>
<text x="196" y="146" font-size="13" font-weight="bold" fill="#5f6b7a">Expert working groups</text>
<path d="M180 150 C180 160, 32 156, 32 170" fill="none" stroke="#518386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="32" y1="170" x2="32" y2="338" stroke="#518386" stroke-width="1.5"/>
<circle cx="32" cy="184" r="5" fill="#518386"/>
<text x="52" y="189" font-size="16" fill="#14335a">Clinical</text>
<text x="52" y="207" font-size="13" fill="#5f6b7a">STI and contraception</text>
<circle cx="32" cy="234" r="5" fill="#518386"/>
<text x="52" y="239" font-size="16" fill="#14335a">Commissioning</text>
<circle cx="32" cy="270" r="5" fill="#518386"/>
<text x="52" y="275" font-size="16" fill="#14335a">Data management</text>
<circle cx="32" cy="306" r="5" fill="#518386"/>
<text x="52" y="311" font-size="16" fill="#14335a">Finance</text>
<line x1="20" y1="338" x2="340" y2="338" stroke="#14335a" stroke-width="1.75"/>
<text x="180" y="367" font-size="16" text-anchor="middle" font-weight="bold" fill="#14335a">Pathway Analytics</text>
<text x="180" y="387" font-size="13" text-anchor="middle" fill="#5f6b7a">Methodology, modelling, analysis, coding</text>
<text x="180" y="403" font-size="13" text-anchor="middle" fill="#5f6b7a">and IT support for all four groups</text>
</svg>
