<text x="638" y="86" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#5f6b7a">Other</text>
<text x="638" y="99" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#5f6b7a">funders</text>
