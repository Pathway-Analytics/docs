<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" width="720" height="712" role="img" aria-label="Five parts of the pathway had funding gaps. Who funded each part of the HIV pathway in London in 2018: eighteen parts, in three stages, against six funders. Funding was unclear or absent for some of: PrEP outside the Impact Trial; screening in emergency care and general wards; community nursing and peer support; drug and alcohol services; and housing, benefits, welfare and migrant issues." font-family="Arial, Helvetica, sans-serif">
<title>Five parts of the pathway had funding gaps. Who funded each part of the HIV pathway in London in 2018: eighteen parts, in three stages, against six funders. Funding was unclear or absent for some of: PrEP outside the Impact Trial; screening in emergency care and general wards; community nursing and peer support; drug and alcohol services; and housing, benefits, welfare and migrant issues.</title>
