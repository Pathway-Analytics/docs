<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="720" height="284" role="img" aria-label="Four steps from care to charging. The provider delivers and records care as usual and codes it in two returns, GUMCAD and SRHAD, plus a few local codes. The Tariff Grouper joins the two datasets into visits, matches them to currencies and prices, and allocates each charge to the council that pays." font-family="Arial, Helvetica, sans-serif">
<title>Four steps from care to charging. The provider delivers and records care as usual and codes it in two returns, GUMCAD and SRHAD, plus a few local codes. The Tariff Grouper joins the two datasets into visits, matches them to currencies and prices, and allocates each charge to the council that pays.</title>
<rect width="720" height="284" fill="#ffffff"/>
<text x="180" y="16" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">Provider</text>
<text x="540" y="16" font-size="13" text-anchor="middle" font-weight="bold" fill="#7a5c1a">Tariff Grouper</text>
<line x1="20" y1="28" x2="340" y2="28" stroke="#e3e6ea" stroke-width="1"/>
<line x1="380" y1="28" x2="700" y2="28" stroke="#e3e6ea" stroke-width="1"/>
<line x1="360" y1="40" x2="360" y2="274" stroke="#5f6b7a" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="20" y1="96" x2="176" y2="96" stroke="#14335a" stroke-width="1.75"/>
<path d="M176 96 L194 84 L414 84 L436 96" fill="none" stroke="#14335a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M176 96 L194 108 L414 108 L436 96" fill="none" stroke="#518386" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="436" y1="96" x2="700" y2="96" stroke="#c9a24a" stroke-width="1.75"/>
<path d="M695.8 99.5 L703 96 L695.8 92.5" fill="none" stroke="#c9a24a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="229" y="77" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#14335a">GUMCAD</text>
<text x="229" y="124" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#3f6b6e">SRHAD</text>
<circle cx="90" cy="96" r="5" fill="#14335a"/>
<circle cx="270" cy="84" r="4.5" fill="#14335a"/>
<circle cx="270" cy="108" r="4.5" fill="#518386"/>
<circle cx="450" cy="96" r="5" fill="#c9a24a"/>
<circle cx="630" cy="96" r="5" fill="#c9a24a"/>
<text x="90" y="148" font-size="17" text-anchor="middle" font-weight="bold" fill="#14335a">Care activity</text>
<text x="90" y="167" font-size="11.5" text-anchor="middle" fill="#5f6b7a">Care delivered and</text>
<text x="90" y="183" font-size="11.5" text-anchor="middle" fill="#5f6b7a">recorded as usual</text>
<text x="270" y="148" font-size="17" text-anchor="middle" font-weight="bold" fill="#14335a">Coding</text>
<text x="270" y="167" font-size="11.5" text-anchor="middle" fill="#5f6b7a">GUMCAD and SRHAD,</text>
<text x="270" y="183" font-size="11.5" text-anchor="middle" fill="#5f6b7a">plus a few local codes</text>
<text x="450" y="148" font-size="17" text-anchor="middle" font-weight="bold" fill="#14335a">Grouping</text>
<text x="450" y="167" font-size="11.5" text-anchor="middle" fill="#5f6b7a">Visits matched to</text>
<text x="450" y="183" font-size="11.5" text-anchor="middle" fill="#5f6b7a">currencies and prices</text>
<text x="630" y="148" font-size="17" text-anchor="middle" font-weight="bold" fill="#14335a">Charging</text>
<text x="630" y="167" font-size="11.5" text-anchor="middle" fill="#5f6b7a">Charges allocated to</text>
<text x="630" y="183" font-size="11.5" text-anchor="middle" fill="#5f6b7a">the council that pays</text>
<line x1="20" y1="200" x2="340" y2="200" stroke="#e3e6ea" stroke-width="1"/>
<line x1="380" y1="200" x2="700" y2="200" stroke="#e3e6ea" stroke-width="1"/>
<text x="20" y="223" font-size="12" fill="#14335a">No change to how clinicians deliver care;</text>
<text x="20" y="241" font-size="12" fill="#14335a">no direct patient identifiers leave the provider</text>
<text x="380" y="223" font-size="12" fill="#14335a">Joins the two datasets into visits</text>
<text x="380" y="241" font-size="12" fill="#14335a">Removes double counting</text>
<text x="380" y="259" font-size="12" fill="#14335a">Primary price first, Additional for the rest</text>
<text x="380" y="277" font-size="12" fill="#14335a">Applies MFF or geographical weighting</text>
</svg>
