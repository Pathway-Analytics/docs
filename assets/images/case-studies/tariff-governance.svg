<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="230" y="0" width="260" height="40" rx="6" fill="#14335a"/>
  <text x="360" y="25" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">London Sexual Health Programme</text>
  <line x1="360" y1="40" x2="360" y2="58" stroke="#9aa3ad" stroke-width="1.5"/>
  <rect x="150" y="58" width="420" height="56" rx="6" fill="#fff" stroke="#14335a" stroke-width="1.5"/>
  <text x="360" y="80" font-size="13" fill="#14335a" text-anchor="middle" font-weight="600">Steering group</text>
  <text x="360" y="100" font-size="11.5" fill="#5f6b7a" text-anchor="middle">Including HPA, BASHH, FSRH and the DH Payment by Results team</text>

  <line x1="360" y1="114" x2="360" y2="148" stroke="#9aa3ad" stroke-width="1.5"/>
  <text x="10" y="140" font-size="11" fill="#5f6b7a" font-weight="600" letter-spacing="1">EXPERT WORKING GROUPS</text>
  <line x1="90" y1="148" x2="630" y2="148" stroke="#9aa3ad" stroke-width="1.5"/>

  <g font-size="12.5" text-anchor="middle" font-weight="600" fill="#fff">
    <line x1="90" y1="148" x2="90" y2="160" stroke="#9aa3ad" stroke-width="1.5"/><rect x="10" y="160" width="160" height="44" rx="6" fill="#46777a"/><text x="90" y="179">Clinical</text><text x="90" y="196" font-size="10.5" font-weight="400">STI and contraception</text>
    <line x1="270" y1="148" x2="270" y2="160" stroke="#9aa3ad" stroke-width="1.5"/><rect x="190" y="160" width="160" height="44" rx="6" fill="#46777a"/><text x="270" y="187">Commissioning</text>
    <line x1="450" y1="148" x2="450" y2="160" stroke="#9aa3ad" stroke-width="1.5"/><rect x="370" y="160" width="160" height="44" rx="6" fill="#46777a"/><text x="450" y="187">Data management</text>
    <line x1="630" y1="148" x2="630" y2="160" stroke="#9aa3ad" stroke-width="1.5"/><rect x="550" y="160" width="160" height="44" rx="6" fill="#46777a"/><text x="630" y="187">Finance</text>
  </g>

  <!-- Foundation: supports all four groups -->
  <g stroke="#14335a" stroke-width="1.5">
    <line x1="90" y1="204" x2="90" y2="212"/>
    <line x1="270" y1="204" x2="270" y2="212"/>
    <line x1="450" y1="204" x2="450" y2="212"/>
    <line x1="630" y1="204" x2="630" y2="212"/>
  </g>
  <rect x="10" y="212" width="700" height="34" rx="6" fill="#e8edf3" stroke="#14335a" stroke-width="1.5"/>
  <text x="360" y="234" font-size="12" fill="#14335a" text-anchor="middle" font-weight="600"><tspan font-weight="700">Pathway Analytics:</tspan> methodology, modelling, analysis, coding and IT support for all four groups</text>
</svg>
