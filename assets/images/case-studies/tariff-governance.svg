<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-label="Governance: the London Sexual Health Programme and its steering group oversaw four expert working groups: clinical, commissioning, data management and finance. Pathway Analytics provided methodology, modelling, analysis, coding and IT support for all four." font-family="Arial, Helvetica, sans-serif">
<title>Governance: the London Sexual Health Programme and its steering group oversaw four expert working groups: clinical, commissioning, data management and finance. Pathway Analytics provided methodology, modelling, analysis, coding and IT support for all four.</title>
<rect width="720" height="352" fill="#ffffff"/>
<text x="360" y="30" font-size="20" text-anchor="middle" font-weight="bold" fill="#14335a">London Sexual Health Programme</text>
<line x1="250" y1="44" x2="470" y2="44" stroke="#e3e6ea" stroke-width="1"/>
<line x1="360" y1="44" x2="360" y2="66" stroke="#518386" stroke-width="1.25"/>
<circle cx="360" cy="68" r="3" fill="#14335a"/>
<text x="360" y="94" font-size="17" text-anchor="middle" fill="#14335a">Steering group</text>
<text x="360" y="114" font-size="12" text-anchor="middle" fill="#5f6b7a">Including HPA, BASHH, FSRH and the DH Payment by Results team</text>
<text x="360" y="146" font-size="12" text-anchor="middle" font-weight="bold" fill="#5f6b7a">Expert working groups</text>
<path d="M360 156 C360 186, 90 178, 90 206" fill="none" stroke="#518386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90" cy="211" r="5" fill="#518386"/>
<text x="90" y="238" font-size="16" text-anchor="middle" fill="#14335a">Clinical</text>
<text x="90" y="256" font-size="11.5" text-anchor="middle" fill="#5f6b7a">STI and contraception</text>
<line x1="90" y1="266" x2="90" y2="290" stroke="#14335a" stroke-width="1.25"/>
<path d="M360 156 C360 186, 270 178, 270 206" fill="none" stroke="#518386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="270" cy="211" r="5" fill="#518386"/>
<text x="270" y="238" font-size="16" text-anchor="middle" fill="#14335a">Commissioning</text>
<line x1="270" y1="266" x2="270" y2="290" stroke="#14335a" stroke-width="1.25"/>
<path d="M360 156 C360 186, 450 178, 450 206" fill="none" stroke="#518386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="450" cy="211" r="5" fill="#518386"/>
<text x="450" y="238" font-size="16" text-anchor="middle" fill="#14335a">Data management</text>
<line x1="450" y1="266" x2="450" y2="290" stroke="#14335a" stroke-width="1.25"/>
<path d="M360 156 C360 186, 630 178, 630 206" fill="none" stroke="#518386" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="630" cy="211" r="5" fill="#518386"/>
<text x="630" y="238" font-size="16" text-anchor="middle" fill="#14335a">Finance</text>
<line x1="630" y1="266" x2="630" y2="290" stroke="#14335a" stroke-width="1.25"/>
<line x1="50" y1="290" x2="670" y2="290" stroke="#14335a" stroke-width="1.75"/>
<text x="360" y="319" font-size="17" text-anchor="middle" font-weight="bold" fill="#14335a">Pathway Analytics</text>
<text x="360" y="340" font-size="12" text-anchor="middle" fill="#5f6b7a">Methodology, modelling, analysis, coding and IT support for all four groups</text>
</svg>
