<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-label="Three illustrative victims and their level of need at each of nine steps, from initial contact to later counselling. An adult is acute from initial contact to verbal evidence, complex for needs assessment and follow-up support, vulnerable for counselling and court support, and ongoing for later counselling. An adolescent is vulnerable at initial contact, risk assessment, needs assessment and counselling, does not need the other steps, and is ongoing for later counselling. A child is acute at every step." font-family="Arial, Helvetica, sans-serif">
<title>Three illustrative victims and their level of need at each of nine steps, from initial contact to later counselling. An adult is acute from initial contact to verbal evidence, complex for needs assessment and follow-up support, vulnerable for counselling and court support, and ongoing for later counselling. An adolescent is vulnerable at initial contact, risk assessment, needs assessment and counselling, does not need the other steps, and is ongoing for later counselling. A child is acute at every step.</title>
