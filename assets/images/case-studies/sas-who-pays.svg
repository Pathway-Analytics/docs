<text x="526" y="294" font-size="12.5" text-anchor="middle" fill="#14335a">Police and Crime</text>
<text x="526" y="310" font-size="12.5" text-anchor="middle" fill="#14335a">Commissioners</text>
<path d="M360 230 C360 256, 640 246, 640 268" fill="none" stroke="#14335a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="640" cy="272" r="4.5" fill="#14335a"/>
<text x="640" y="294" font-size="12.5" text-anchor="middle" fill="#14335a">Ministry</text>
<text x="640" y="310" font-size="12.5" text-anchor="middle" fill="#14335a">of Justice</text>
</svg>
