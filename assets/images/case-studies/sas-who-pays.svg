<text x="184" y="294" font-size="12.5" text-anchor="middle" fill="#14335a">Clinical</text>
<text x="184" y="310" font-size="12.5" text-anchor="middle" fill="#14335a">commissioning groups</text>
<path d="M360 230 C360 256, 298 246, 298 268" fill="none" stroke="#14335a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="298" cy="272" r="4.5" fill="#14335a"/>
<text x="298" y="294" font-size="12.5" text-anchor="middle" fill="#14335a">Local</text>
<text x="298" y="310" font-size="12.5" text-anchor="middle" fill="#14335a">authorities</text>
<path d="M360 230 C360 256, 412 246, 412 268" fill="none" stroke="#14335a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
