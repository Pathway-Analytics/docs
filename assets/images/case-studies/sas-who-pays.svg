<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" role="img" aria-label="Each step of the pathway, from initial contact to court support, is costed and multiplied by the number of victims who use it. The steps add up to the total cost of the pathways, which is split step by step between NHS England, clinical commissioning groups, local authorities, the police, Police and Crime Commissioners and the Ministry of Justice. A proposed allocation, not an agreed settlement." font-family="Arial, Helvetica, sans-serif">
<title>Each step of the pathway, from initial contact to court support, is costed and multiplied by the number of victims who use it. The steps add up to the total cost of the pathways, which is split step by step between NHS England, clinical commissioning groups, local authorities, the police, Police and Crime Commissioners and the Ministry of Justice. A proposed allocation, not an agreed settlement.</title>
<rect width="720" height="322" fill="#ffffff"/>
<text x="10" y="16" font-size="12" font-weight="bold" fill="#5f6b7a">Victims who reach the services</text>
<line x1="10" y1="68" x2="700" y2="68" stroke="#14335a" stroke-width="1.75"/>
<circle cx="50" cy="68" r="4.5" fill="#14335a"/>
<text x="50" y="42" font-size="11.5" text-anchor="middle" fill="#14335a">Initial</text>
<text x="50" y="56" font-size="11.5" text-anchor="middle" fill="#14335a">contact</text>
<text x="50" y="92" font-size="11.5" text-anchor="middle" fill="#5f6b7a">£ × victims</text>
<path d="M50 102 C50 138, 360 128, 360 164" fill="none" stroke="#518386" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="138" cy="68" r="4.5" fill="#14335a"/>
<text x="138" y="42" font-size="11.5" text-anchor="middle" fill="#14335a">Risk</text>
<text x="138" y="56" font-size="11.5" text-anchor="middle" fill="#14335a">assessment</text>
<text x="138" y="92" font-size="11.5" text-anchor="middle" fill="#5f6b7a">£ × victims</text>
<path d="M138 102 C138 138, 360 128, 360 164" fill="none" stroke="#518386" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="226" cy="68" r="4.5" fill="#14335a"/>
<text x="226" y="42" font-size="11.5" text-anchor="middle" fill="#14335a">Forensic</text>
<text x="226" y="56" font-size="11.5" text-anchor="middle" fill="#14335a">examination</text>
<text x="226" y="92" font-size="11.5" text-anchor="middle" fill="#5f6b7a">£ × victims</text>
<path d="M226 102 C226 138, 360 128, 360 164" fill="none" stroke="#518386" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="314" cy="68" r="4.5" fill="#14335a"/>
<text x="314" y="42" font-size="11.5" text-anchor="middle" fill="#14335a">Verbal</text>
<text x="314" y="56" font-size="11.5" text-anchor="middle" fill="#14335a">evidence</text>
<text x="314" y="92" font-size="11.5" text-anchor="middle" fill="#5f6b7a">£ × victims</text>
<path d="M314 102 C314 138, 360 128, 360 164" fill="none" stroke="#518386" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="402" cy="68" r="4.5" fill="#14335a"/>
<text x="402" y="42" font-size="11.5" text-anchor="middle" fill="#14335a">Needs</text>
<text x="402" y="56" font-size="11.5" text-anchor="middle" fill="#14335a">assessment</text>
<text x="402" y="92" font-size="11.5" text-anchor="middle" fill="#5f6b7a">£ × victims</text>
<path d="M402 102 C402 138, 360 128, 360 164" fill="none" stroke="#518386" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="490" cy="68" r="4.5" fill="#14335a"/>
<text x="490" y="42" font-size="11.5" text-anchor="middle" fill="#14335a">Follow-up</text>
<text x="490" y="56" font-size="11.5" text-anchor="middle" fill="#14335a">support</text>
<text x="490" y="92" font-size="11.5" text-anchor="middle" fill="#5f6b7a">£ × victims</text>
<path d="M490 102 C490 138, 360 128, 360 164" fill="none" stroke="#518386" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="578" cy="68" r="4.5" fill="#14335a"/>
<text x="578" y="56" font-size="11.5" text-anchor="middle" fill="#14335a">Counselling</text>
<text x="578" y="92" font-size="11.5" text-anchor="middle" fill="#5f6b7a">£ × victims</text>
<path d="M578 102 C578 138, 360 128, 360 164" fill="none" stroke="#518386" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="666" cy="68" r="4.5" fill="#14335a"/>
<text x="666" y="42" font-size="11.5" text-anchor="middle" fill="#14335a">Court</text>
