<text x="360" y="202" font-size="16" text-anchor="middle" font-weight="bold" fill="#14335a">Total cost of the pathways</text>
<line x1="360" y1="212" x2="360" y2="230" stroke="#14335a" stroke-width="1.25"/>
<text x="372" y="228" font-size="12" font-weight="bold" fill="#5f6b7a">Split step by step between six public bodies</text>
<path d="M360 230 C360 256, 70 246, 70 268" fill="none" stroke="#14335a" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
