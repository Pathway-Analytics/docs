<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-label="Costing a client pathway: each component is costed at four levels of need, from ongoing to acute, with relative costs rising from one to four pound signs. Ongoing clients need no verbal evidence or forensic examination. Choosing a level, here vulnerable, gives the cost of one client's pathway at that level." font-family="Arial, Helvetica, sans-serif">
<title>Costing a client pathway: each component is costed at four levels of need, from ongoing to acute, with relative costs rising from one to four pound signs. Ongoing clients need no verbal evidence or forensic examination. Choosing a level, here vulnerable, gives the cost of one client's pathway at that level.</title>
<rect width="720" height="350" fill="#ffffff"/>
<rect x="380" y="34" width="110" height="216" fill="#f4f6f8"/>
<circle cx="395" cy="20" r="6.5" fill="#c9a24a"/>
<text x="407" y="24.5" font-size="12" font-weight="bold" fill="#7a5c1a">Level chosen</text>
<text x="10" y="52" font-size="12" font-weight="bold" fill="#5f6b7a">Level of need</text>
<text x="325" y="52" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">Ongoing</text>
<rect x="285" y="58" width="80" height="5" fill="#8fabcf"/>
<text x="435" y="52" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">Vulnerable</text>
<rect x="395" y="58" width="80" height="5" fill="#3e6aa0"/>
<text x="545" y="52" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">Complex</text>
<rect x="505" y="58" width="80" height="5" fill="#25497c"/>
<text x="655" y="52" font-size="13" text-anchor="middle" font-weight="bold" fill="#14335a">Acute</text>
<rect x="615" y="58" width="80" height="5" fill="#14335a"/>
<line x1="10" y1="70" x2="710" y2="70" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="93" font-size="13.5" fill="#14335a">Initial contact</text>
<text x="325" y="93" font-size="15" text-anchor="middle" fill="#14335a">£</text>
<text x="435" y="93" font-size="15" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="545" y="93" font-size="15" text-anchor="middle" fill="#14335a">£££</text>
<text x="655" y="93" font-size="15" text-anchor="middle" fill="#14335a">££££</text>
<line x1="10" y1="106" x2="710" y2="106" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="129" font-size="13.5" fill="#14335a">Risk assessment</text>
<text x="325" y="129" font-size="15" text-anchor="middle" fill="#14335a">£</text>
<text x="435" y="129" font-size="15" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="545" y="129" font-size="15" text-anchor="middle" fill="#14335a">£££</text>
<text x="655" y="129" font-size="15" text-anchor="middle" fill="#14335a">££££</text>
<line x1="10" y1="142" x2="710" y2="142" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="165" font-size="13.5" fill="#14335a">Verbal evidence</text>
<text x="325" y="164" font-size="11.5" text-anchor="middle" font-style="italic" fill="#5f6b7a">Not needed</text>
<text x="435" y="165" font-size="15" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="545" y="165" font-size="15" text-anchor="middle" fill="#14335a">£££</text>
<text x="655" y="165" font-size="15" text-anchor="middle" fill="#14335a">££££</text>
<line x1="10" y1="178" x2="710" y2="178" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="201" font-size="13.5" fill="#14335a">Forensic examination</text>
<text x="325" y="200" font-size="11.5" text-anchor="middle" font-style="italic" fill="#5f6b7a">Not needed</text>
<text x="435" y="201" font-size="15" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="545" y="201" font-size="15" text-anchor="middle" fill="#14335a">£££</text>
<text x="655" y="201" font-size="15" text-anchor="middle" fill="#14335a">££££</text>
<line x1="10" y1="214" x2="710" y2="214" stroke="#e3e6ea" stroke-width="1"/>
<text x="10" y="237" font-size="13.5" fill="#14335a">Needs assessment</text>
<text x="325" y="237" font-size="15" text-anchor="middle" fill="#14335a">£</text>
<text x="435" y="237" font-size="15" text-anchor="middle" font-weight="bold" fill="#14335a">££</text>
<text x="545" y="237" font-size="15" text-anchor="middle" fill="#14335a">£££</text>
<text x="655" y="237" font-size="15" text-anchor="middle" fill="#14335a">££££</text>
<line x1="10" y1="250" x2="710" y2="250" stroke="#e3e6ea" stroke-width="1"/>
<line x1="435" y1="250" x2="435" y2="276" stroke="#c9a24a" stroke-width="1.75"/>
<path d="M431.5 272.8 L435 280 L438.5 272.8" fill="none" stroke="#c9a24a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
<text x="435" y="304" font-size="15" text-anchor="middle" font-weight="bold" fill="#14335a">Cost of one client's pathway at this level</text>
<text x="10" y="336" font-size="12" fill="#5f6b7a">Higher need adds staff time, specialist input such as interpreters, and sometimes extra steps</text>
</svg>
