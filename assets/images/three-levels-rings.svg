<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Three levels of action on health inequality</title>
  <desc id="d">Three nested arcs. At the centre, treating inequality: access to effective care. Around it, preventing inequality: social and commercial conditions. Outermost, changing structures: how money is divided and what is rewarded. Most health economics works at the centre; the causes sit further out.</desc>
  <rect x="0.5" y="0.5" width="679" height="419" rx="8" fill="#ffffff"/>
  <path d="M60 360 A280 280 0 0 1 620 360 Z" fill="#e8eef7" stroke="#1f4788" stroke-width="0.75"/>
  <path d="M150 360 A190 190 0 0 1 530 360 Z" fill="#bfd3f2" stroke="#1f4788" stroke-width="0.75"/>
  <path d="M240 360 A100 100 0 0 1 440 360 Z" fill="#1f4788"/>
  <text x="340" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Treating</text>
  <text x="340" y="336" text-anchor="middle" font-size="12" fill="#e8eef7">access to effective care</text>
  <text x="340" y="218" text-anchor="middle" font-size="15" font-weight="700" fill="#163561">Preventing</text>
  <text x="340" y="240" text-anchor="middle" font-size="12" fill="#163561">social and commercial conditions</text>
  <text x="340" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#163561">Changing structures</text>
  <text x="340" y="150" text-anchor="middle" font-size="12" fill="#163561">how money is divided, what is rewarded</text>
  <line x1="60" y1="360" x2="620" y2="360" stroke="#9ca3af" stroke-width="0.75"/>
  <text x="340" y="394" text-anchor="middle" font-size="13" fill="#374151">Most health economics works at the centre. The causes sit further out.</text>
</svg>
